  &lt;script&gt;
    (() =&gt; {
      const root = document.documentElement;
      const button = document.getElementById(&#39;motionToggle&#39;);
      const prefersReduced = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
      let playing = !prefersReduced.matches;
      function render() {
        root.classList.toggle(&#39;is-paused&#39;, !playing);
        button.setAttribute(&#39;aria-pressed&#39;, String(playing));
        button.setAttribute(&#39;aria-label&#39;, playing ? &#39;暂停动画&#39; : &#39;播放动画&#39;);
        button.lastElementChild.textContent = playing ? &#39;暂停动画&#39; : &#39;播放动画&#39;;
      }
      function toggle() { playing = !playing; render(); }
      button.addEventListener(&#39;click&#39;, toggle);
      document.addEventListener(&#39;keydown&#39;, event =&gt; {
        if (event.code === &#39;Space&#39; &amp;&amp; !event.altKey &amp;&amp; !event.ctrlKey &amp;&amp; !event.metaKey) {
          event.preventDefault(); toggle();
        }
      });
      prefersReduced.addEventListener(&#39;change&#39;, event =&gt; { if (event.matches) { playing = false; render(); } });
      render();
    })();
