&lt;script&gt;
(() =&gt; {
  &quot;use strict&quot;;
  const get = id =&gt; document.getElementById(id);
  const button = get(&quot;toggle&quot;);
  const preference = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
  const parts = {rider:get(&quot;rider&quot;),rear:get(&quot;rear-spokes&quot;),front:get(&quot;front-spokes&quot;),crank:get(&quot;crank&quot;),nearLeg:get(&quot;near-leg&quot;),farLeg:get(&quot;far-leg&quot;),nearFoot:get(&quot;near-foot&quot;),farFoot:get(&quot;far-foot&quot;),pedal:get(&quot;near-pedal&quot;),clouds:get(&quot;clouds&quot;),water:get(&quot;water&quot;),road:get(&quot;road&quot;),plants:get(&quot;plants&quot;),breeze:get(&quot;breeze&quot;),shadow:get(&quot;shadow&quot;)};
  let playing = !preference.matches, manuallyChosen = false, elapsed = 0, previous = null, frame = 0;
  function draw(time) {
    const angle = time * Math.PI * 2 / 1.65, degrees = angle * 180 / Math.PI;
    const x = 559 + Math.cos(angle) * 27, y = 456 + Math.sin(angle) * 27;
    const backX = 559 - Math.cos(angle) * 27, backY = 456 - Math.sin(angle) * 27, bob = Math.sin(angle * 2) * 2;
    parts.rear.setAttribute(&quot;transform&quot;, `rotate(${degrees} 400 456)`);
    parts.front.setAttribute(&quot;transform&quot;, `rotate(${degrees} 735 456)`);
    parts.crank.setAttribute(&quot;transform&quot;, `rotate(${degrees} 559 456)`);
    parts.nearLeg.setAttribute(&quot;d&quot;, `M563 346 Q587 372 ${594 + (x - 559) * .2} ${396 + (y - 456) * .35} L${x} ${y - 5}`);
    parts.farLeg.setAttribute(&quot;d&quot;, `M542 354 Q548 378 ${554 + (backX - 559) * .25} ${406 + (backY - 456) * .3} L${backX} ${backY - 5}`);
    parts.nearFoot.setAttribute(&quot;d&quot;, `M${x - 9} ${y - 5}q13-3 23 5h-23Z`);
    parts.farFoot.setAttribute(&quot;d&quot;, `M${backX - 9} ${backY - 3}h25`);
    parts.pedal.setAttribute(&quot;d&quot;, `M${x - 12} ${y + 2}h25`);
    parts.rider.setAttribute(&quot;transform&quot;, `translate(0 ${bob})`);
    parts.clouds.setAttribute(&quot;transform&quot;, `translate(${-((time * 8) % 1100)} 0)`);
    parts.road.setAttribute(&quot;transform&quot;, `translate(${-((time * 105) % 190)} 0)`);
    parts.water.setAttribute(&quot;x&quot;, -((time * 12) % 220));
    parts.plants.setAttribute(&quot;transform&quot;, `translate(${-((time * 65) % 1100)} 0)`);
    parts.breeze.setAttribute(&quot;transform&quot;, `translate(${-Math.sin(angle * .5) * 8} 0)`);
    parts.breeze.setAttribute(&quot;opacity&quot;, .5 + Math.sin(angle * .5) * .2);
    parts.shadow.setAttribute(&quot;rx&quot;, 206 - bob * 1.5);
  }
  function tick(timestamp) {
    frame = 0;
    if (!playing || document.hidden) { previous = null; return; }
    if (previous !== null) elapsed += Math.min((timestamp - previous) / 1000, .05);
    previous = timestamp; draw(elapsed); frame = requestAnimationFrame(tick);
  }
  function schedule() { if (playing &amp;&amp; !document.hidden &amp;&amp; !frame) frame = requestAnimationFrame(tick); }
  function update() {
    button.setAttribute(&quot;aria-pressed&quot;, String(playing));
    button.setAttribute(&quot;aria-label&quot;, playing ? &quot;暂停动画&quot; : &quot;播放动画&quot;);
    get(&quot;control-text&quot;).textContent = playing ? &quot;暂停&quot; : &quot;播放&quot;;
    get(&quot;control-icon&quot;).setAttribute(&quot;d&quot;, playing ? &quot;M4 3h3v10H4zm5 0h3v10H9z&quot; : &quot;M4 2l10 6-10 6z&quot;);
    if (frame) cancelAnimationFrame(frame);
    frame = 0; previous = null; schedule();
  }
  function toggle() { manuallyChosen = true; playing = !playing; update(); }
  button.addEventListener(&quot;click&quot;, toggle);
  document.addEventListener(&quot;keydown&quot;, event =&gt; {
    if (event.code !== &quot;Space&quot; || event.altKey || event.ctrlKey || event.metaKey) return;
    const target = event.target;
    if (target instanceof Element &amp;&amp; target.closest(&quot;input, textarea, select, [contenteditable=&#39;true&#39;]&quot;)) return;
    event.preventDefault(); if (!event.repeat) toggle();
  });
  document.addEventListener(&quot;visibilitychange&quot;, () =&gt; { if (frame) cancelAnimationFrame(frame); frame = 0; previous = null; schedule(); });
  preference.addEventListener(&quot;change&quot;, event =&gt; { if (!manuallyChosen) { playing = !event.matches; update(); } });

})();
