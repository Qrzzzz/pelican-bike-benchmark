  &lt;noscript&gt;&lt;p&gt;启用 JavaScript 后可播放骑行动画；当前展示静态插画。&lt;/p&gt;&lt;/noscript&gt;
&lt;/main&gt;
&lt;script&gt;
(() =&gt; {
  &#39;use strict&#39;;
  const byId = id =&gt; document.getElementById(id);
  const ids = [&#39;rear-spokes&#39;,&#39;front-spokes&#39;,&#39;crank&#39;,&#39;near-leg&#39;,&#39;far-leg&#39;,&#39;near-foot&#39;,&#39;far-foot&#39;,&#39;near-pedal&#39;,&#39;far-pedal&#39;,&#39;rider&#39;,&#39;scarf-tail&#39;,&#39;road&#39;,&#39;sea&#39;,&#39;clouds&#39;,&#39;breeze&#39;];
  const parts = Object.fromEntries(ids.map(id =&gt; [id, byId(id)]));
  const button = byId(&#39;toggle&#39;);
  const preference = matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
  const narrow = matchMedia(&#39;(max-width: 600px)&#39;);
  let playing = false;
  let frame = null;
  let previous = null;
  let elapsed = 0;
  const transform = (id, value) =&gt; parts[id].setAttribute(&#39;transform&#39;, value);

  function resize() {
    byId(&#39;scene&#39;).setAttribute(&#39;viewBox&#39;, narrow.matches ? &#39;285 45 605 565&#39; : &#39;0 0 1100 650&#39;);
  }
  function leg(side, phase, bob) {
    const x = 540 + Math.cos(phase) * 32;
    const y = 461 + Math.sin(phase) * 32;
    const hx = side === &#39;near&#39; ? 532 : 525;
    const hy = 330 + bob;
    const dx = x - hx, dy = y - hy;
    const distance = Math.hypot(dx, dy);
    const bend = Math.sqrt(Math.max(0, 86 * 86 - distance * distance / 4));
    const kx = (hx + x) / 2 + dy / distance * bend;
    const ky = (hy + y) / 2 - dx / distance * bend;
    parts[side + &#39;-leg&#39;].setAttribute(&#39;d&#39;, `M${hx} ${hy}L${kx} ${ky} ${x} ${y}`);
    parts[side + &#39;-foot&#39;].setAttribute(&#39;d&#39;, `M${x-6} ${y-7}Q${x+1} ${y-12} ${x+7} ${y-5}L${x+22} ${y+1} ${x+10} ${y+3} ${x+3} ${y+1} ${x-8} ${y+3}Z`);
    transform(side + &#39;-pedal&#39;, `translate(${x} ${y})`);
  }
  function draw() {
    const phase = elapsed * Math.PI * 2 / 1.65;
    const bob = Math.sin(phase * 2) * 1.6;
    const rotation = (elapsed * 210) % 360;
    transform(&#39;rear-spokes&#39;, `rotate(${rotation})`);
    transform(&#39;front-spokes&#39;, `rotate(${rotation})`);
    transform(&#39;crank&#39;, `rotate(${phase * 180 / Math.PI % 360} 540 461)`);
    transform(&#39;rider&#39;, `translate(0 ${bob})`);
    transform(&#39;scarf-tail&#39;, `rotate(${Math.sin(phase) * 3} 570 210)`);
    transform(&#39;road&#39;, `translate(${-elapsed * 110 % 210} 0)`);
    transform(&#39;sea&#39;, `translate(${-elapsed * 12 % 170} 0)`);
    transform(&#39;clouds&#39;, `translate(${Math.sin(elapsed * .18) * 16} 0)`);
    parts.breeze.setAttribute(&#39;opacity&#39;, .45 + Math.sin(elapsed * 2) * .2);
    leg(&#39;far&#39;, phase + Math.PI, bob);
    leg(&#39;near&#39;, phase, bob);
  }
  function tick(now) {
    frame = null;
    if (!playing || document.hidden) return;
    if (previous !== null) elapsed += Math.min((now - previous) / 1000, .05);
    previous = now;
    draw();
    frame = requestAnimationFrame(tick);
  }
  function schedule() {
    if (frame !== null) cancelAnimationFrame(frame);
    frame = null;
    previous = null;
    if (playing &amp;&amp; !document.hidden) frame = requestAnimationFrame(tick);
  }
  function setPlaying(value, announce = true) {
    playing = value;
    button.setAttribute(&#39;aria-pressed&#39;, String(playing));
    button.setAttribute(&#39;aria-label&#39;, playing ? &#39;暂停动画&#39; : &#39;播放动画&#39;);
    byId(&#39;control-label&#39;).textContent = playing ? &#39;暂停骑行&#39; : &#39;播放骑行&#39;;
    byId(&#39;control-icon&#39;).setAttribute(&#39;d&#39;, playing ? &#39;M3 2h4v12H3ZM10 2h4v12h-4Z&#39; : &#39;M4 2l10 6-10 6Z&#39;);
    if (announce) byId(&#39;status&#39;).textContent = playing ? &#39;骑行动画已播放&#39; : &#39;骑行动画已暂停&#39;;
    schedule();
  }
  button.addEventListener(&#39;click&#39;, () =&gt; setPlaying(!playing));
  document.addEventListener(&#39;keydown&#39;, event =&gt; {
    if (event.code !== &#39;Space&#39; || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.target instanceof Element &amp;&amp; event.target.closest(&#39;input,textarea,select,[contenteditable=&quot;true&quot;]&#39;)) return;
    event.preventDefault();
    if (!event.repeat) setPlaying(!playing);
  });
  document.addEventListener(&#39;visibilitychange&#39;, schedule);
  preference.addEventListener(&#39;change&#39;, event =&gt; { if (event.matches) setPlaying(false); });
  narrow.addEventListener(&#39;change&#39;, resize);
  resize();
  draw();
  setPlaying(!preference.matches, false);
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></body></html>
