  const crankArm = document.getElementById(&#39;crank-arm&#39;);
  const pedal = document.getElementById(&#39;pedal&#39;);
  const body = document.getElementById(&#39;body&#39;);
  const tail = document.getElementById(&#39;tail&#39;);
  const wing = document.getElementById(&#39;wing&#39;);
  const neck = document.getElementById(&#39;neck&#39;);
  const head = document.getElementById(&#39;head&#39;);
  const eye = document.getElementById(&#39;eye&#39;);
  const beakUpper = document.getElementById(&#39;beak-upper&#39;);
  const beakLower = document.getElementById(&#39;beak-lower&#39;);
  const pouch = document.getElementById(&#39;pouch&#39;);
  const legUpper = document.getElementById(&#39;leg-upper&#39;);
  const legLower = document.getElementById(&#39;leg-lower&#39;);
  const foot = document.getElementById(&#39;foot&#39;);

  const roadDashes = Array.from(document.querySelectorAll(&#39;#road-dashes rect&#39;));
  const bush1 = document.getElementById(&#39;bush1&#39;);
  const bush2 = document.getElementById(&#39;bush2&#39;);
  const bush3 = document.getElementById(&#39;bush3&#39;);
  const cloud1 = document.getElementById(&#39;cloud1&#39;);
  const cloud2 = document.getElementById(&#39;cloud2&#39;);

  // Base positions
  const BBX = 510, BBY = 568;
  const CRANK_R = 30;
  const REAR_X = 360, REAR_Y = 562;
  const FRONT_X = 720, FRONT_Y = 562;
  const HIP_X = 485, HIP_BASE_Y = 430;
  const BODY_BASE_Y = 385;
  const HEAD_BASE_Y = 338;
  const PIVOT_X = 540, PIVOT_BASE_Y = 395;

  // Road dash bases
  const dashBases = roadDashes.map(r =&gt; parseFloat(r.getAttribute(&#39;x&#39;)));
  const PERIOD = 200;
  const WRAP = 1400;

  // Bush bases
  let bushBases = [
    {g: bush1, base: 95, factor: 0.32},
    {g: bush2, base: 410, factor: 0.32},
    {g: bush3, base: 990, factor: 0.32}
  ];
  const bushWrap = 1250;

  // Cloud bases
  let cloudData = [
    {g: cloud1, base: 220, factor: 0.06},
    {g: cloud2, base: 780, factor: 0.06}
  ];
  const cloudWrap = 1350;

  // State
  let playing = true;
  let angle = 12; // deg
  let lastTime = performance.now();

  function rotatePoint(px, py, cx, cy, deg) {
    const rad = deg * Math.PI / 180;
    const dx = px - cx;
    const dy = py - cy;
    // clockwise to match SVG rotate
    return [
      cx + dx * Math.cos(rad) + dy * Math.sin(rad),
      cy - dx * Math.sin(rad) + dy * Math.cos(rad)
    ];
  }

  function updateScene() {
    const rad = angle * Math.PI / 180;
    const speedFactor = 0.96;

    // Wheel spokes rotation (clockwise)
    const rot = `rotate(${angle} 0 0)`;
    rearSpokes.setAttribute(&#39;transform&#39;, rot);
    frontSpokes.setAttribute(&#39;transform&#39;, rot);

    // Pedal / crank position
    const pedalX = BBX + CRANK_R * Math.sin(rad);
    const pedalY = BBY + CRANK_R * Math.cos(rad) * 0.92;

    crankArm.setAttribute(&#39;x2&#39;, pedalX);
    crankArm.setAttribute(&#39;y2&#39;, pedalY);
    pedal.setAttribute(&#39;x&#39;, pedalX - 15);
    pedal.setAttribute(&#39;y&#39;, pedalY - 3);

    // Bob &amp; flap
    const bob = Math.sin(rad * 1.15) * 3.6;
    const headBob = Math.sin(rad * 2.4) * 1.8;
    const flap = Math.sin(rad * 3.6) * 16;

    // Body bob
    body.setAttribute(&#39;cy&#39;, BODY_BASE_Y + bob);

    // Tail bob
    const tY = bob * 0.85;
    tail.setAttribute(&#39;d&#39;, `M428,${395 + tY} Q395,${415 + tY} 405,${455 + tY} Q428,${432 + tY} 445,${400 + tY}`);

    // Wing: shift + rotate points
    const wBob = bob * 0.55;
    const wPivotY = PIVOT_BASE_Y + wBob;
    let wPts = [
      [535, 372 + wBob],
      [592, 358 + wBob],
      [625, 388 + wBob],
      [598, 418 + wBob],
      [535, 395 + wBob]
    ];
    const rotated = wPts.map(p =&gt; rotatePoint(p[0], p[1], PIVOT_X, wPivotY, flap));
    wing.setAttribute(&#39;points&#39;, rotated.map(p =&gt; p[0].toFixed(1) + &#39;,&#39; + p[1].toFixed(1)).join(&#39; &#39;));

    // Neck
    const neckStartY = 355 + bob;
    const neckEndY = 338 + headBob;
    neck.setAttribute(&#39;d&#39;, `M555,${neckStartY.toFixed(1)} Q580,${((neckStartY + neckEndY) / 2 - 4).toFixed(1)} 600,${neckEndY.toFixed(1)}`);

    // Head &amp; face
    head.setAttribute(&#39;cy&#39;, HEAD_BASE_Y + headBob);
    eye.setAttribute(&#39;cy&#39;, 333 + headBob);

    const hb = headBob;
    beakUpper.setAttribute(&#39;d&#39;, `M632,${(336 + hb).toFixed(1)} L728,${(340 + hb).toFixed(1)}`);
    beakLower.setAttribute(&#39;d&#39;, `M632,${(341 + hb).toFixed(1)} L722,${(347 + hb).toFixed(1)}`);

    // Pouch swing
    const pouchSwing = Math.sin(rad * 1.7) * 4.5;
    const pY = 348 + hb;
    pouch.setAttribute(&#39;d&#39;, `M645,${pY.toFixed(1)} Q${(682 + pouchSwing * 0.3).toFixed(1)},${(372 + pouchSwing).toFixed(1)} 718,${(352 + hb * 0.6).toFixed(1)}`);

    // Legs (simple IK approximation)
    const hipY = HIP_BASE_Y + bob;
    const footX = pedalX + 2;
    const footY = pedalY + 4;

    // 2-segment leg approx
    const L1 = 52, L2 = 48;
    const dx = footX - HIP_X;
    const dy = footY - hipY;
    const dist = Math.hypot(dx, dy) || 0.001;
    let kx, ky;

    if (dist &gt;= L1 + L2) {
      const r = L1 / (L1 + L2);
      kx = HIP_X + dx * r;
      ky = hipY + dy * r;
    } else {
      const cosA = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
      const a = Math.acos(Math.max(-1, Math.min(1, cosA)));
      const baseA = Math.atan2(dy, dx);
      const kneeA = baseA - a;
      kx = HIP_X + L1 * Math.cos(kneeA);
      ky = hipY + L1 * Math.sin(kneeA);
    }

    legUpper.setAttribute(&#39;x1&#39;, HIP_X);
    legUpper.setAttribute(&#39;y1&#39;, hipY);
    legUpper.setAttribute(&#39;x2&#39;, kx);
    legUpper.setAttribute(&#39;y2&#39;, ky);

    legLower.setAttribute(&#39;x1&#39;, kx);
    legLower.setAttribute(&#39;y1&#39;, ky);
    legLower.setAttribute(&#39;x2&#39;, footX);
    legLower.setAttribute(&#39;y2&#39;, footY);

    foot.setAttribute(&#39;cx&#39;, footX);
    foot.setAttribute(&#39;cy&#39;, footY);

    // Road dashes
    const roadOffset = angle * speedFactor;
    for (let i = 0; i &lt; roadDashes.length; i++) {
      let x = dashBases[i] - roadOffset;
      x = ((x % WRAP) + WRAP) % WRAP;
      roadDashes[i].setAttribute(&#39;x&#39;, x);
    }

    // Bushes (parallax)
    for (let i = 0; i &lt; bushBases.length; i++) {
      const b = bushBases[i];
      let bx = b.base - (roadOffset * b.factor);
      bx = ((bx % bushWrap) + bushWrap) % bushWrap;
      const circles = b.g.querySelectorAll(&#39;circle&#39;);
      const dx = bx - b.base;
      circles.forEach(c =&gt; {
        const baseCx = parseFloat(c.getAttribute(&#39;data-base&#39;) || c.getAttribute(&#39;cx&#39;));
        if (!c.hasAttribute(&#39;data-base&#39;)) c.setAttribute(&#39;data-base&#39;, baseCx);
        c.setAttribute(&#39;cx&#39;, baseCx + dx);
      });
    }

    // Clouds (slow)
    for (let i = 0; i &lt; cloudData.length; i++) {
      const c = cloudData[i];
      let cx = c.base - (roadOffset * c.factor);
      cx = ((cx % cloudWrap) + cloudWrap) % cloudWrap;
      const dx = cx - c.base;
      const ells = c.g.querySelectorAll(&#39;ellipse&#39;);
      ells.forEach(e =&gt; {
        const baseCx = parseFloat(e.getAttribute(&#39;data-base&#39;) || e.getAttribute(&#39;cx&#39;));
        if (!e.hasAttribute(&#39;data-base&#39;)) e.setAttribute(&#39;data-base&#39;, baseCx);
        e.setAttribute(&#39;cx&#39;, baseCx + dx);
      });
    }
  }

  function togglePlay() {
    playing = !playing;
    if (playing) {
      lastTime = performance.now();
      btnIcon.textContent = &#39;⏸&#39;;
      btnText.textContent = &#39;暂停&#39;;
      btn.setAttribute(&#39;aria-pressed&#39;, &#39;true&#39;);
    } else {
      btnIcon.textContent = &#39;▶&#39;;
      btnText.textContent = &#39;播放&#39;;
      btn.setAttribute(&#39;aria-pressed&#39;, &#39;false&#39;);
    }
  }

  btn.addEventListener(&#39;click&#39;, togglePlay);

  document.addEventListener(&#39;keydown&#39;, function(e) {
    if (e.key === &#39; &#39; || e.key === &#39;Spacebar&#39; || e.key === &#39;Space&#39;) {
      e.preventDefault();
      togglePlay();
    }
  });

  // Reduced motion
  const reduceMQ = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
  if (reduceMQ.matches) {
    playing = false;
    btnIcon.textContent = &#39;▶&#39;;
    btnText.textContent = &#39;播放&#39;;
    btn.setAttribute(&#39;aria-pressed&#39;, &#39;false&#39;);
  }

  reduceMQ.addEventListener(&#39;change&#39;, function() {
    if (reduceMQ.matches &amp;&amp; playing) {
      playing = false;
      btnIcon.textContent = &#39;▶&#39;;
      btnText.textContent = &#39;播放&#39;;
      btn.setAttribute(&#39;aria-pressed&#39;, &#39;false&#39;);
    }
  });

  // Main loop
  function loop(now) {
    if (playing) {
      const dt = now - lastTime;
      lastTime = now;
      angle = (angle + dt * 0.185) % 360;
      updateScene();
    } else {
      lastTime = now;
    }
    requestAnimationFrame(loop);
  }

  // Boot
  updateScene();
  lastTime = performance.now();
  requestAnimationFrame(loop);

  // Initial button state
  if (playing) {
    btnIcon.textContent = &#39;⏸&#39;;
    btnText.textContent = &#39;暂停&#39;;
    btn.setAttribute(&#39;aria-pressed&#39;, &#39;true&#39;);
  } else {
    btnIcon.textContent = &#39;▶&#39;;
    btnText.textContent = &#39;播放&#39;;
    btn.setAttribute(&#39;aria-pressed&#39;, &#39;false&#39;);
  }

  // Keyboard focus hint for button
  btn.setAttribute(&#39;tabindex&#39;, &#39;0&#39;);
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></body></html>
