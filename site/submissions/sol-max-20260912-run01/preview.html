  &lt;style&gt;
    :root {
      color-scheme: dark;
      --ink: #15363a;
      --cream: #fff8e8;
      --sun: #ffd780;
      --coral: #ef835d;
      --teal: #1d5a60;
      --road: #173b3f;
      --line: rgba(255, 248, 232, 0.82);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100svh;
      color: var(--cream);
      background: #123f47;
      font-family: ui-rounded, &quot;Segoe UI&quot;, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .scene {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 20%, rgba(255, 216, 130, 0.25), transparent 28rem),
        #123f47;
    }

    .scene-art {
      width: 100%;
      height: 100svh;
      min-height: 34rem;
      display: block;
    }

    .masthead {
      position: absolute;
      z-index: 5;
      top: max(1.25rem, env(safe-area-inset-top));
      left: max(1.35rem, env(safe-area-inset-left));
      pointer-events: none;
      text-shadow: 0 2px 20px rgba(8, 35, 40, 0.26);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.62rem;
      margin: 0 0 0.55rem;
      color: rgba(255, 248, 232, 0.86);
      font-size: clamp(0.78rem, 1.2vw, 0.93rem);
      font-weight: 750;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 2.2rem;
      height: 2px;
      border-radius: 99px;
      background: var(--sun);
      content: &quot;&quot;;
    }

    h1 {
      max-width: 8ch;
      margin: 0;
      font-family: Georgia, &quot;Times New Roman&quot;, &quot;Noto Serif SC&quot;, serif;
      font-size: clamp(2.65rem, 6vw, 5.4rem);
      font-weight: 650;
      line-height: 0.92;
      letter-spacing: -0.06em;
    }

    .control {
      position: absolute;
      z-index: 6;
      top: max(1.25rem, env(safe-area-inset-top));
      right: max(1.25rem, env(safe-area-inset-right));
      display: inline-flex;
      min-width: 7rem;
      min-height: 3rem;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.72rem 1.05rem;
      border: 1px solid rgba(255, 248, 232, 0.36);
      border-radius: 999px;
      color: var(--cream);
      background: rgba(11, 44, 49, 0.72);
      box-shadow: 0 0.75rem 2rem rgba(5, 28, 32, 0.18), inset 0 1px rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font: inherit;
      font-size: 1rem;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease;
    }

    .control:hover {
      border-color: rgba(255, 248, 232, 0.68);
      background: rgba(19, 66, 71, 0.88);
      transform: translateY(-2px);
    }

    .control:active { transform: translateY(0); }

    .control:focus-visible {
      outline: 3px solid var(--sun);
      outline-offset: 4px;
    }

    .control-icon {
      position: relative;
      width: 1.1rem;
      height: 1.1rem;
      flex: 0 0 auto;
    }

    .control-icon::before,
    .control-icon::after {
      position: absolute;
      top: 0.12rem;
      width: 0.25rem;
      height: 0.86rem;
      border-radius: 0.12rem;
      background: currentColor;
      content: &quot;&quot;;
      transition: 160ms ease;
    }

    .control-icon::before { left: 0.19rem; }
    .control-icon::after { right: 0.19rem; }

    body:not(.is-playing) .control-icon::before {
      top: 0.05rem;
      left: 0.24rem;
      width: 0;
      height: 0;
      border-top: 0.51rem solid transparent;
      border-bottom: 0.51rem solid transparent;
      border-left: 0.78rem solid currentColor;
      border-radius: 0;
      background: transparent;
    }

    body:not(.is-playing) .control-icon::after { opacity: 0; }

    .hint {
      position: absolute;
      z-index: 5;
      right: max(1.5rem, env(safe-area-inset-right));
      bottom: max(1.15rem, env(safe-area-inset-bottom));
      margin: 0;
      color: rgba(255, 248, 232, 0.72);
      font-size: clamp(0.75rem, 1.2vw, 0.9rem);
      font-weight: 650;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .animated {
      animation-play-state: paused !important;
      will-change: transform;
    }

    .is-playing .animated { animation-play-state: running !important; }

    .cloud-track {
      animation: cloud-drift 38s linear infinite;
      transform-box: view-box;
    }

    .sun-ring {
      animation: sun-breathe 4.5s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 932px 158px;
    }

    .far-grass {
      animation: far-drift 10s linear infinite;
      transform-box: view-box;
    }

    .road-marks { animation: road-flow 1.15s linear infinite; }

    .speed-lines {
      animation: speed-flow 1.15s linear infinite;
      transform-box: view-box;
    }

    .rider-rig {
      animation: ride-bob 1.15s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 600px 600px;
    }

    .rear-spin,
    .front-spin {
      animation: wheel-turn 1.15s linear infinite;
      transform-box: view-box;
    }

    .rear-spin { transform-origin: 360px 600px; }
    .front-spin { transform-origin: 840px 600px; }

    .crank-spin {
      animation: wheel-turn 1.15s linear infinite;
      transform-box: view-box;
      transform-origin: 570px 600px;
    }

    .leg-front,
    .leg-back {
      animation-duration: 1.15s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      transform-box: view-box;
    }

    .leg-front {
      animation-name: leg-front;
      transform-origin: 535px 405px;
    }

    .leg-back {
      animation-name: leg-back;
      transform-origin: 555px 408px;
    }

    .wing {
      animation: wing-pulse 2.3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 495px 315px;
    }

    .head-plume {
      animation: plume-wave 1.15s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 613px 125px;
    }

    .tail {
      animation: tail-wave 1.15s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 454px 352px;
    }

    @keyframes cloud-drift {
      from { transform: translateX(0); }
      to { transform: translateX(-1200px); }
    }

    @keyframes far-drift {
      from { transform: translateX(0); }
      to { transform: translateX(-240px); }
    }

    @keyframes sun-breathe {
      0%, 100% { transform: scale(0.96); opacity: 0.55; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }

    @keyframes road-flow {
      to { stroke-dashoffset: 180; }
    }

    @keyframes speed-flow {
      from { transform: translateX(0); opacity: 0.72; }
      to { transform: translateX(-185px); opacity: 0.3; }
    }

    @keyframes ride-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px) rotate(-0.18deg); }
    }

    @keyframes wheel-turn { to { transform: rotate(360deg); } }

    @keyframes leg-front {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(7deg); }
    }

    @keyframes leg-back {
      0%, 100% { transform: rotate(6deg); }
      50% { transform: rotate(-5deg); }
    }

    @keyframes wing-pulse {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(3deg) translateY(-2px); }
    }

    @keyframes plume-wave {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(7deg); }
    }

    @keyframes tail-wave {
      0%, 100% { transform: rotate(1deg); }
      50% { transform: rotate(-4deg); }
    }

    @media (max-width: 700px) {
      .scene-art { min-height: 32rem; }

      .masthead {
        top: max(1rem, env(safe-area-inset-top));
        left: max(1rem, env(safe-area-inset-left));
      }

      h1 {
        max-width: 7ch;
        font-size: clamp(2.35rem, 13vw, 3.6rem);
      }

      .eyebrow { margin-bottom: 0.4rem; }

      .control {
        top: auto;
        right: auto;
        bottom: max(1.1rem, env(safe-area-inset-bottom));
        left: 50%;
        min-width: 8.4rem;
        transform: translateX(-50%);
        background: rgba(9, 40, 45, 0.9);
      }

      .control:hover { transform: translateX(-50%) translateY(-2px); }
      .control:active { transform: translateX(-50%); }
      .hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .control { transition-duration: 0.01ms; }
    }

  &lt;script&gt;
    (() =&gt; {
      const button = document.getElementById(&#39;motionToggle&#39;);
      const label = document.getElementById(&#39;controlLabel&#39;);
      const sceneArt = document.getElementById(&#39;sceneArt&#39;);
      const reducedMotion = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
      const narrowViewport = window.matchMedia(&#39;(max-width: 700px)&#39;);
      const shortViewport = window.matchMedia(&#39;(max-height: 500px)&#39;);
      let isPlaying = !reducedMotion.matches;

      const renderFraming = () =&gt; {
        if (narrowViewport.matches &amp;&amp; !shortViewport.matches) {
          sceneArt.setAttribute(&#39;viewBox&#39;, &#39;170 0 860 800&#39;);
          sceneArt.setAttribute(&#39;preserveAspectRatio&#39;, &#39;xMidYMid meet&#39;);
        } else if (shortViewport.matches) {
          sceneArt.setAttribute(&#39;viewBox&#39;, &#39;0 0 1200 800&#39;);
          sceneArt.setAttribute(&#39;preserveAspectRatio&#39;, &#39;xMidYMid meet&#39;);
        } else {
          sceneArt.setAttribute(&#39;viewBox&#39;, &#39;0 0 1200 800&#39;);
          sceneArt.setAttribute(&#39;preserveAspectRatio&#39;, &#39;xMidYMid slice&#39;);
        }
      };

      const renderState = () =&gt; {
        document.body.classList.toggle(&#39;is-playing&#39;, isPlaying);
        button.setAttribute(&#39;aria-pressed&#39;, String(isPlaying));
        button.setAttribute(&#39;aria-label&#39;, isPlaying ? &#39;暂停动画&#39; : &#39;播放动画&#39;);
        label.textContent = isPlaying ? &#39;暂停&#39; : &#39;播放&#39;;
      };

      const toggleMotion = () =&gt; {
        isPlaying = !isPlaying;
        renderState();
      };

      button.addEventListener(&#39;click&#39;, toggleMotion);

      document.addEventListener(&#39;keydown&#39;, (event) =&gt; {
        if (event.code !== &#39;Space&#39; || event.altKey || event.ctrlKey || event.metaKey) return;

        const activeElement = document.activeElement;
        const tagName = activeElement?.tagName;
        const isTyping = tagName === &#39;INPUT&#39; || tagName === &#39;TEXTAREA&#39; || tagName === &#39;SELECT&#39; || activeElement?.isContentEditable;
        if (isTyping) return;

        event.preventDefault();
        toggleMotion();
      });

      reducedMotion.addEventListener?.(&#39;change&#39;, (event) =&gt; {
        if (event.matches &amp;&amp; isPlaying) {
          isPlaying = false;
          renderState();
        }
      });

      narrowViewport.addEventListener?.(&#39;change&#39;, renderFraming);
      shortViewport.addEventListener?.(&#39;change&#39;, renderFraming);

      renderFraming();
      renderState();
    })();
  &lt;/script&gt;
