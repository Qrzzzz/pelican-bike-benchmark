&lt;script&gt;
(function () {
  &#39;use strict&#39;;

  var $ = function (id) { return document.getElementById(id); };
  var scene = $(&#39;scene&#39;), playBtn = $(&#39;playBtn&#39;), btnLabel = $(&#39;btnLabel&#39;), status = $(&#39;status&#39;);
  var wR = $(&#39;wR&#39;), wF = $(&#39;wF&#39;), cN = $(&#39;cN&#39;), cF = $(&#39;cF&#39;);
  var pN = $(&#39;pN&#39;), pF = $(&#39;pF&#39;), footN = $(&#39;footN&#39;), footF = $(&#39;footF&#39;);
  var legNI = $(&#39;legNI&#39;), legFI = $(&#39;legFI&#39;);
  var birdA = $(&#39;birdA&#39;), birdB = $(&#39;birdB&#39;), wing = $(&#39;wing&#39;), eye = $(&#39;eye&#39;);
  var chT = $(&#39;chT&#39;), chB = $(&#39;chB&#39;), cl = $(&#39;cl&#39;);

  var DEG = Math.PI / 180;
  var GROUND = 250;            // 地面前进速度 px/s
  var WDEG = (GROUND / 82) * 180 / Math.PI;  // 车轮角速度 deg/s
  var CRW = 324;               // 曲柄角速度 deg/s（约 0.9 转/秒）
  var TH0 = -50;               // 初始曲柄相位
  var BBX = 612, BBY = 624, CR = 34;
  var HIP_N = { x: 648, y: 462 }, HIP_F = { x: 626, y: 466 };
  var L1 = 116, L2 = 112;
  var WRAP = 2400, LO = -560;  // 背景循环区间 [-560, 1840)

  var f1 = function (v) { return Math.round(v * 10) / 10; };
  var f2 = function (v) { return Math.round(v * 100) / 100; };
  var T = function (el, tr) { el.setAttribute(&#39;transform&#39;, tr); };

  // ---- 背景视差元素登记 ----
  var movers = [];
  var nodes = scene.querySelectorAll(&#39;[data-px]&#39;);
  for (var i = 0; i &lt; nodes.length; i++) {
    var el = nodes[i];
    movers.push({ el: el, x0: parseFloat(el.getAttribute(&#39;data-x&#39;)), y: parseFloat(el.getAttribute(&#39;data-y&#39;)), f: parseFloat(el.getAttribute(&#39;data-px&#39;)) });
  }

  // ---- 幅条与气门嘴 ----
  function buildSpokes() {
    var NS = &#39;http://www.w3.org/2000/svg&#39;;
    var spec = [[&#39;spR&#39;, 468, 583], [&#39;spF&#39;, 792, 583]];
    spec.forEach(function (s) {
      var g = $(s[0]), cx = s[1], cy = s[2], k, a, l;
      for (k = 0; k &lt; 8; k++) {
        a = k * Math.PI / 4;
        l = document.createElementNS(NS, &#39;line&#39;);
        l.setAttribute(&#39;x1&#39;, f1(cx + 12 * Math.cos(a)));
        l.setAttribute(&#39;y1&#39;, f1(cy + 12 * Math.sin(a)));
        l.setAttribute(&#39;x2&#39;, f1(cx + 66 * Math.cos(a)));
        l.setAttribute(&#39;y2&#39;, f1(cy + 66 * Math.sin(a)));
        l.setAttribute(&#39;stroke&#39;, &#39;#cfd9e6&#39;);
        l.setAttribute(&#39;stroke-width&#39;, &#39;2.5&#39;);
        g.appendChild(l);
      }
      l = document.createElementNS(NS, &#39;line&#39;);
      l.setAttribute(&#39;x1&#39;, f1(cx + 8)); l.setAttribute(&#39;y1&#39;, f1(cy + 64));
      l.setAttribute(&#39;x2&#39;, f1(cx + 10)); l.setAttribute(&#39;y2&#39;, f1(cy + 76));
      l.setAttribute(&#39;stroke&#39;, &#39;#3f4552&#39;);
      l.setAttribute(&#39;stroke-width&#39;, &#39;4&#39;);
      l.setAttribute(&#39;stroke-linecap&#39;, &#39;round&#39;);
      g.appendChild(l);
    });
  }

  // ---- 两骨 IK：返回靠前（+x）的膝盖 ----
  function ik(h, ft) {
    var dx = ft.x - h.x, dy = ft.y - h.y;
    var d = Math.max(8, Math.min(224, Math.hypot(dx, dy)));
    var a = Math.atan2(dy, dx);
    var c = Math.min(1, Math.max(-1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
    var b = Math.acos(c);
    var k1x = h.x + L1 * Math.cos(a + b), k1y = h.y + L1 * Math.sin(a + b);
    var k2x = h.x + L1 * Math.cos(a - b), k2y = h.y + L1 * Math.sin(a - b);
    return (k1x &gt;= k2x) ? { x: k1x, y: k1y } : { x: k2x, y: k2y };
  }
  function drawLeg(path, h, ft) {
    var k = ik(h, ft);
    path.setAttribute(&#39;d&#39;, &#39;M &#39; + f1(h.x) + &#39; &#39; + f1(h.y) +
      &#39; L &#39; + f1(k.x) + &#39; &#39; + f1(k.y) +
      &#39; L &#39; + f1(ft.x) + &#39; &#39; + f1(ft.y));
  }

  // ---- 每帧渲染 ----
  var render = function (t) {
    var th = (TH0 + CRW * t) % 360;
    var thr = th * DEG, phr = thr + Math.PI;
    var wd = (WDEG * t) % 360;

    T(wR, &#39;rotate(&#39; + f1(wd) + &#39; 468 583)&#39;);
    T(wF, &#39;rotate(&#39; + f1(wd) + &#39; 792 583)&#39;);
    T(cN, &#39;rotate(&#39; + f1(th) + &#39; 612 624)&#39;);
    T(cF, &#39;rotate(&#39; + f1(th + 180) + &#39; 612 624)&#39;);

    var pnx = BBX + CR * Math.cos(thr), pny = BBY + CR * Math.sin(thr);
    var pfx = BBX + CR * Math.cos(phr), pfy = BBY + CR * Math.sin(phr);
    T(pN, &#39;translate(&#39; + f1(pnx) + &#39; &#39; + f1(pny) + &#39;)&#39;);
    T(pF, &#39;translate(&#39; + f1(pfx) + &#39; &#39; + f1(pfy) + &#39;)&#39;);
    T(footN, &#39;translate(&#39; + f1(pnx) + &#39; &#39; + f1(pny - 12) + &#39;)&#39;);
    T(footF, &#39;translate(&#39; + f1(pfx) + &#39; &#39; + f1(pfy - 12) + &#39;)&#39;);

    var by = 2.4 * Math.sin(2 * thr);
    var br = Math.sin(thr);
    var tr = &#39;translate(0 &#39; + f1(by) + &#39;) rotate(&#39; + f1(br) + &#39; 585 380)&#39;;
    T(birdA, tr); T(birdB, tr);
    T(wing, &#39;rotate(&#39; + f1(2.4 * Math.sin(t * 2.027)) + &#39; 676 330)&#39;);

    var s = 1, bp = t % 3.7;
    if (bp &gt; 3.56) { s = 1 - 0.92 * Math.sin(Math.PI * ((bp - 3.56) / 0.14)); }
    T(eye, &#39;translate(786 268) scale(1 &#39; + f2(Math.max(0.06, s)) + &#39;) translate(-786 -268)&#39;);

    drawLeg(legNI, { x: HIP_N.x, y: HIP_N.y + by }, { x: pnx, y: pny - 26 });
    drawLeg(legFI, { x: HIP_F.x, y: HIP_F.y + by }, { x: pfx, y: pfy - 26 });

    var o16 = (118.75 * t) % 16;
    chT.setAttribute(&#39;stroke-dashoffset&#39;, f2(o16));
    chB.setAttribute(&#39;stroke-dashoffset&#39;, f2(16 - o16));
    cl.setAttribute(&#39;stroke-dashoffset&#39;, f2((GROUND * t) % 86));

    for (var j = 0; j &lt; movers.length; j++) {
      var m = movers[j];
      var x = m.x0 - GROUND * t * m.f;
      x = ((x - LO) % WRAP + WRAP) % WRAP + LO;
      m.el.setAttribute(&#39;transform&#39;, &#39;translate(&#39; + f1(x) + &#39; &#39; + m.y + &#39;)&#39;);
    }
  };

  // ---- 播放控制 ----
  var playing = false, t = 0, lastTs = 0, raf = 0;

  function setUI() {
    document.body.setAttribute(&#39;data-play&#39;, playing ? &#39;1&#39; : &#39;0&#39;);
    playBtn.setAttribute(&#39;aria-pressed&#39;, playing ? &#39;true&#39; : &#39;false&#39;);
    btnLabel.textContent = playing ? &#39;暂停&#39; : &#39;播放&#39;;
    status.textContent = playing ? &#39;状态：前进中&#39; : &#39;状态：已暂停&#39;;
  }
  function loop(ts) {
    if (!playing) return;
    if (lastTs) t += Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    render(t);
    raf = requestAnimationFrame(loop);
  }
  function play() {
    if (playing) return;
    playing = true; lastTs = 0; setUI();
    raf = requestAnimationFrame(loop);
  }
  function pause() {
    if (!playing) return;
    playing = false;
    cancelAnimationFrame(raf);
    setUI();
  }
  function toggle() { playing ? pause() : play(); }

  var lastSpace = 0;
  playBtn.addEventListener(&#39;click&#39;, function () {
    if (performance.now() - lastSpace &lt; 300) return;
    toggle();
  });
  window.addEventListener(&#39;keydown&#39;, function (e) {
    if (e.code === &#39;Space&#39;) {
      e.preventDefault();
      if (e.repeat) return;
      lastSpace = performance.now();
      toggle();
    }
  });

  // ---- 视口适配：动态 viewBox，保证小车完整可见 ----
  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    if (!w || !h) return;
    var a = w / h;
    var H = 1200 / a;
    H = Math.min(1400, Math.max(430, H));
    var W = a * H;
    var x0 = 660 - W / 2;
    var minX = -560, maxX = 1840 - W;
    if (maxX &lt; minX) maxX = minX;
    x0 = Math.min(Math.max(x0, minX), maxX);
    var y0 = 800 - H;
    scene.setAttribute(&#39;viewBox&#39;,
      f1(x0) + &#39; &#39; + f1(y0) + &#39; &#39; + f1(W) + &#39; &#39; + f1(H));
  }

  buildSpokes();
  onResize();
  window.addEventListener(&#39;resize&#39;, onResize);

  render(0);

  var mq = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
  if (mq.addEventListener) {
    mq.addEventListener(&#39;change&#39;, function (e) { if (e.matches &amp;&amp; playing) pause(); });
  }
  if (!mq.matches) { play(); } else { setUI(); }
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></body></html>
