<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml"><title>Grok 4.7 · xhigh · 沙盒预览</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;display:block;overflow:hidden}</style></head><body><iframe title="Grok 4.7 · xhigh" sandbox="allow-scripts" referrerpolicy="no-referrer" allow="camera 'none'; microphone 'none'; geolocation 'none'; clipboard-read 'none'; clipboard-write 'none'" srcdoc="&lt;!doctype html&gt;&lt;meta http-equiv=&quot;Content-Security-Policy&quot; content=&quot;default-src &#39;none&#39;; script-src &#39;unsafe-inline&#39;; style-src &#39;unsafe-inline&#39;; img-src data:; connect-src &#39;none&#39;; font-src &#39;none&#39;; media-src &#39;none&#39;; frame-src &#39;none&#39;; worker-src &#39;none&#39;; object-src &#39;none&#39;; base-uri &#39;none&#39;; form-action &#39;none&#39;&quot;&gt;&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;zh-CN&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;鹈鹕骑行&lt;/title&gt;
&lt;style&gt;
  :root {
    --btn: #1d4e89;
    --btn-text: #fff;
    --focus: #ffb703;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #16324f;
    color: #10263f;
    font-family: &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;
  }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    background: rgba(255,255,255,.94);
    border-bottom: 1px solid rgba(16,38,63,.12);
  }
  h1 {
    margin: 0;
    font-size: clamp(1rem, 2.4vw, 1.35rem);
    letter-spacing: .04em;
  }
  #toggle {
    appearance: none;
    border: 2px solid transparent;
    background: var(--btn);
    color: var(--btn-text);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 7.5rem;
  }
  #toggle:hover { filter: brightness(1.08); }
  #toggle:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
    min-width: 0;
  }
  #stage {
    display: block;
    width: 100%;
    height: 100%;
    min-width: 0;
    background: #8fd0f5;
    touch-action: manipulation;
  }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @media (max-width: 640px) {
    header { padding: 8px 12px; }
    #toggle { min-width: 6.5rem; padding: 10px 16px; }
  }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;header&gt;
  &lt;h1&gt;鹈鹕骑行&lt;/h1&gt;
  &lt;button id=&quot;toggle&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;暂停&lt;/button&gt;
&lt;/header&gt;
&lt;main&gt;
  &lt;canvas id=&quot;stage&quot; role=&quot;img&quot; aria-label=&quot;一只鹈鹕正沿着海边公路骑自行车前进，车轮和脚踏在转动，海鸥与云朵向后掠过。&quot;&gt;&lt;/canvas&gt;
  &lt;p id=&quot;status&quot; class=&quot;visually-hidden&quot; aria-live=&quot;polite&quot;&gt;动画正在播放&lt;/p&gt;
&lt;/main&gt;
&lt;script&gt;
(function () {
  &quot;use strict&quot;;

  var canvas = document.getElementById(&quot;stage&quot;);
  var btn = document.getElementById(&quot;toggle&quot;);
  var status = document.getElementById(&quot;status&quot;);
  var ctx = canvas.getContext(&quot;2d&quot;);

  var reduce = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
  var playing = !reduce;
  var raf = 0;
  var last = 0;
  var t = 0;

  var VW = 1200;
  var VH = 800;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = canvas.clientWidth;
    var h = canvas.clientHeight;
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
  }

  function syncControl() {
    btn.setAttribute(&quot;aria-pressed&quot;, playing ? &quot;true&quot; : &quot;false&quot;);
    btn.textContent = playing ? &quot;暂停&quot; : &quot;播放&quot;;
    status.textContent = playing ? &quot;动画正在播放&quot; : &quot;动画已暂停&quot;;
  }

  function toggle() {
    playing = !playing;
    syncControl();
    if (playing) {
      last = 0;
      raf = requestAnimationFrame(frame);
    } else if (raf) {
      cancelAnimationFrame(raf);
      raf = 0;
    }
  }

  btn.addEventListener(&quot;click&quot;, toggle);
  window.addEventListener(&quot;keydown&quot;, function (e) {
    if (e.code !== &quot;Space&quot; &amp;&amp; e.key !== &quot; &quot;) return;
    var tag = (e.target &amp;&amp; e.target.tagName) || &quot;&quot;;
    if (tag === &quot;INPUT&quot; || tag === &quot;TEXTAREA&quot;) return;
    e.preventDefault();
    toggle();
  });
  window.addEventListener(&quot;resize&quot;, function () {
    resize();
    draw(t);
  });

  function roundRect(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function cloud(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = &quot;rgba(255,255,255,0.92)&quot;;
    ctx.beginPath();
    ctx.arc(0, 10, 26, 0, Math.PI * 2);
    ctx.arc(32, 4, 34, 0, Math.PI * 2);
    ctx.arc(68, 12, 24, 0, Math.PI * 2);
    ctx.arc(40, 22, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function gull(x, y, s, flap) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.strokeStyle = &quot;#f7fbff&quot;;
    ctx.lineWidth = 3;
    ctx.lineCap = &quot;round&quot;;
    ctx.beginPath();
    ctx.moveTo(-22, 4);
    ctx.quadraticCurveTo(-10, -16 * flap, 0, 0);
    ctx.quadraticCurveTo(10, -16 * flap, 22, 4);
    ctx.stroke();
    ctx.restore();
  }

  function wheel(x, y, r, spin) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(spin);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = &quot;#2b2b2b&quot;;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, r - 7, 0, Math.PI * 2);
    ctx.fillStyle = &quot;#dce7ef&quot;;
    ctx.fill();
    ctx.strokeStyle = &quot;#3a4652&quot;;
    ctx.lineWidth = 3;
    var i, a;
    for (i = 0; i &lt; 8; i++) {
      a = (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * (r - 8), Math.sin(a) * (r - 8));
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fillStyle = &quot;#f4c95d&quot;;
    ctx.fill();
    ctx.restore();
  }

  function leg(hip, foot, L1, L2) {
    var dx = foot.x - hip.x;
    var dy = foot.y - hip.y;
    var dist = Math.hypot(dx, dy);
    var max = L1 + L2 - 0.5;
    var min = Math.abs(L1 - L2) + 0.5;
    dist = Math.max(min, Math.min(max, dist));
    var ang = Math.atan2(dy, dx);
    var cosA = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
    var a = Math.acos(Math.max(-1, Math.min(1, cosA)));
    var a1 = ang + a;
    return {
      x: hip.x + Math.cos(a1) * L1,
      y: hip.y + Math.sin(a1) * L1
    };
  }

  function limb(a, b, c, width, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = &quot;round&quot;;
    ctx.lineJoin = &quot;round&quot;;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.lineTo(c.x, c.y);
    ctx.stroke();
  }

  function draw(time) {
    var cw = canvas.width;
    var ch = canvas.height;
    var scale = Math.min(cw / VW, ch / VH);
    var ox = (cw - VW * scale) / 2;
    var oy = (ch - VH * scale) / 2;
    var bob = Math.sin(time * 7.2) * 3.2;
    var spin = time * 9;
    var scroll = time * 220;
    var sky, i, x, y, color, hills, flap, bx, by, R, bb, crank;
    var pedalA, pedalB, footA, footB, px, py, hipA, hipB, kneeA, kneeB, wingLift;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.setTransform(scale, 0, 0, scale, ox, oy);

    sky = ctx.createLinearGradient(0, 0, 0, 470);
    sky.addColorStop(0, &quot;#67b7ea&quot;);
    sky.addColorStop(0.55, &quot;#b6e2fb&quot;);
    sky.addColorStop(1, &quot;#e7f6ff&quot;);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VW, 500);

    ctx.fillStyle = &quot;#f6d98a&quot;;
    ctx.beginPath();
    ctx.arc(980, 92, 46, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = &quot;rgba(255,236,170,0.35)&quot;;
    ctx.beginPath();
    ctx.arc(980, 92, 70, 0, Math.PI * 2);
    ctx.fill();

    for (i = 0; i &lt; 4; i++) {
      x = ((i * 340 - scroll * 0.25) % (VW + 280)) ;
      if (x &lt; 0) x += VW + 280;
      x -= 140;
      cloud(x, 70 + (i % 2) * 46, 0.85 + (i % 3) * 0.18);
    }

    hills = [&quot;#8fbf6d&quot;, &quot;#79ae58&quot;, &quot;#6aa34c&quot;];
    for (i = 0; i &lt; hills.length; i++) {
      color = hills[i];
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 500);
      for (x = 0; x &lt;= VW; x += 20) {
        y = 430 + i * 16 + Math.sin((x + scroll * (0.15 + i * 0.08)) / (90 - i * 12)) * (22 - i * 4);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(VW, 500);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = &quot;#5f8f42&quot;;
    ctx.fillRect(0, 548, VW, 252);
    ctx.fillStyle = &quot;#4d4f55&quot;;
    ctx.fillRect(0, 575, VW, 150);

    ctx.strokeStyle = &quot;#f4f1e8&quot;;
    ctx.lineWidth = 8;
    ctx.setLineDash([46, 34]);
    ctx.lineDashOffset = -scroll;
    ctx.beginPath();
    ctx.moveTo(0, 648);
    ctx.lineTo(VW, 648);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = &quot;#6d5438&quot;;
    ctx.fillRect(0, 725, VW, 75);
    for (i = 0; i &lt; 8; i++) {
      x = ((i * 180 - scroll * 1.15) % (VW + 80));
      if (x &lt; 0) x += VW + 80;
      x -= 40;
      ctx.fillStyle = i % 2 ? &quot;#d8b48a&quot; : &quot;#c9d7ea&quot;;
      ctx.beginPath();
      ctx.ellipse(x, 760, 16, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    flap = 0.55 + Math.sin(time * 8) * 0.45;
    for (i = 0; i &lt; 3; i++) {
      x = ((i * 420 - scroll * 0.55) % (VW + 120));
      if (x &lt; 0) x += VW + 120;
      x -= 60;
      gull(x, 150 + i * 28, 1, flap);
    }

    bx = 430;
    by = 612 + bob;
    R = 78;

    wheel(bx, by, R, spin);
    wheel(bx + 250, by, R, spin);

    ctx.strokeStyle = &quot;#245c86&quot;;
    ctx.lineWidth = 9;
    ctx.lineJoin = &quot;round&quot;;
    ctx.lineCap = &quot;round&quot;;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + 118, by - 92);
    ctx.lineTo(bx + 250, by);
    ctx.moveTo(bx + 118, by - 92);
    ctx.lineTo(bx + 150, by);
    ctx.moveTo(bx + 78, by - 18);
    ctx.lineTo(bx + 168, by - 18);
    ctx.stroke();

    ctx.strokeStyle = &quot;#1b3f5c&quot;;
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(bx + 250, by);
    ctx.lineTo(bx + 286, by - 118);
    ctx.lineTo(bx + 248, by - 132);
    ctx.stroke();
    ctx.fillStyle = &quot;#1b3f5c&quot;;
    ctx.beginPath();
    ctx.arc(bx + 248, by - 132, 7, 0, Math.PI * 2);
    ctx.arc(bx + 286, by - 118, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = &quot;#c4493a&quot;;
    roundRect(bx + 92, by - 28, 62, 16, 6);
    ctx.fill();

    bb = { x: bx + 150, y: by };
    crank = 34;
    pedalA = spin;
    pedalB = spin + Math.PI;
    footA = { x: bb.x + Math.cos(pedalA) * crank, y: bb.y + Math.sin(pedalA) * crank };
    footB = { x: bb.x + Math.cos(pedalB) * crank, y: bb.y + Math.sin(pedalB) * crank };

    ctx.strokeStyle = &quot;#d7dee6&quot;;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(bb.x, bb.y, 16, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bb.x, bb.y);
    ctx.lineTo(footA.x, footA.y);
    ctx.moveTo(bb.x, bb.y);
    ctx.lineTo(footB.x, footB.y);
    ctx.stroke();

    px = bx + 92;
    py = by - 168 + bob * 0.35;
    hipA = { x: px + 18, y: py + 118 };
    hipB = { x: px + 2, y: py + 122 };
    kneeA = leg(hipA, footA, 78, 74);
    kneeB = leg(hipB, footB, 78, 74);

    limb(hipB, kneeB, footB, 11, &quot;#f0a05a&quot;);
    limb(hipA, kneeA, footA, 12, &quot;#e9893a&quot;);

    function pedalPad(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(0.2);
      ctx.fillStyle = &quot;#222&quot;;
      roundRect(-16, -5, 32, 10, 3);
      ctx.fill();
      ctx.restore();
    }
    pedalPad(footB);
    pedalPad(footA);

    ctx.fillStyle = &quot;#f4f7fb&quot;;
    ctx.beginPath();
    ctx.ellipse(px + 34, py + 78, 58, 46, -0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = &quot;#e7edf3&quot;;
    ctx.beginPath();
    ctx.ellipse(px + 18, py + 92, 28, 18, -0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = &quot;#fff&quot;;
    ctx.beginPath();
    ctx.ellipse(px + 8, py + 18, 34, 30, -0.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = &quot;#1d2430&quot;;
    ctx.beginPath();
    ctx.arc(px + 18, py + 12, 5.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = &quot;#fff&quot;;
    ctx.beginPath();
    ctx.arc(px + 20, py + 10, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = &quot;#f3b24a&quot;;
    ctx.lineWidth = 10;
    ctx.lineCap = &quot;round&quot;;
    ctx.beginPath();
    ctx.moveTo(px + 28, py + 20);
    ctx.quadraticCurveTo(px + 120, py + 8, px + 168, py + 34);
    ctx.stroke();
    ctx.fillStyle = &quot;#f0a328&quot;;
    ctx.beginPath();
    ctx.moveTo(px + 78, py + 16);
    ctx.quadraticCurveTo(px + 108, py + 48, px + 150, py + 36);
    ctx.quadraticCurveTo(px + 112, py + 28, px + 86, py + 24);
    ctx.fill();

    wingLift = Math.sin(time * 6.5) * 10;
    ctx.fillStyle = &quot;#d5dee8&quot;;
    ctx.beginPath();
    ctx.moveTo(px - 8, py + 62);
    ctx.quadraticCurveTo(px - 78, py + 20 + wingLift, px - 108, py + 78 + wingLift);
    ctx.quadraticCurveTo(px - 70, py + 96, px + 6, py + 100);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = &quot;#b7c4d2&quot;;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px - 10, py + 70);
    ctx.quadraticCurveTo(px - 62, py + 48 + wingLift, px - 96, py + 82 + wingLift);
    ctx.stroke();

    ctx.fillStyle = &quot;#f7b24a&quot;;
    ctx.beginPath();
    ctx.moveTo(px + 8, py + 150);
    ctx.lineTo(px - 2, py + 168);
    ctx.lineTo(px + 22, py + 164);
    ctx.closePath();
    ctx.fill();
  }

  function frame(now) {
    if (!playing) return;
    if (!last) last = now;
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    t += dt;
    draw(t);
    raf = requestAnimationFrame(frame);
  }

  if (reduce) {
    btn.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
    btn.textContent = &quot;播放&quot;;
    status.textContent = &quot;已根据减少动态偏好暂停，可手动播放&quot;;
  } else {
    syncControl();
  }
  resize();
  draw(0);
  if (playing) raf = requestAnimationFrame(frame);
})();
&lt;/script&gt;
&lt;/body&gt;
