  &lt;title&gt;鹈鹕上路 · Pelican on the Move&lt;/title&gt;
  &lt;style&gt;
    :root {
      color-scheme: light;
      --ink: #18354a;
      --muted-ink: #5b7180;
      --paper: #f5f0e7;
      --paper-deep: #e7ded0;
      --accent: #ec7042;
      --accent-dark: #c95533;
      --teal: #187f87;
      --sky: #cde9ef;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: #e8eff0;
    }

    body {
      min-width: 0;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      background:
        radial-gradient(circle at 8% 8%, rgba(255, 255, 255, .86), transparent 26rem),
        linear-gradient(145deg, #dbeaec 0%, #f5f0e7 48%, #e7dfd3 100%);
    }

    button,
    svg {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: clamp(12px, 3.2vw, 38px);
    }

    .artboard {
      width: min(1200px, 100%);
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(24, 53, 74, .14);
      border-radius: clamp(18px, 2.5vw, 28px);
      box-shadow:
        0 28px 70px rgba(24, 53, 74, .16),
        0 4px 12px rgba(24, 53, 74, .08);
    }

    .chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: clamp(18px, 3vw, 30px) clamp(18px, 4vw, 46px) clamp(14px, 2.2vw, 22px);
      background: var(--paper);
    }

    .title-group {
      min-width: 0;
    }

    .eyebrow,
    .route-label,
    .footer-label {
      color: var(--muted-ink);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .19em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    h1 {
      margin: 7px 0 0;
      font-size: clamp(24px, 4vw, 42px);
      font-weight: 850;
      letter-spacing: -.055em;
      line-height: .98;
    }

    h1 span {
      color: var(--accent);
      font-size: .46em;
      font-weight: 750;
      letter-spacing: .12em;
      margin-left: .45em;
      vertical-align: .17em;
      text-transform: uppercase;
    }

    .motion-toggle {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 16px;
      color: #fffaf1;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .01em;
      cursor: pointer;
      background: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 5px 0 rgba(24, 53, 74, .18);
      transition: background-color .2s ease, border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .motion-toggle:hover {
      background: #244c64;
      border-color: #244c64;
      transform: translateY(-1px);
      box-shadow: 0 6px 0 rgba(24, 53, 74, .18);
    }

    .motion-toggle:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(24, 53, 74, .18);
    }

    .motion-toggle:focus-visible {
      outline: 3px solid #f1b448;
      outline-offset: 4px;
    }

    .motion-glyph {
      position: relative;
      display: inline-block;
      flex: 0 0 14px;
      width: 14px;
      height: 14px;
    }

    .motion-glyph.is-pause::before,
    .motion-glyph.is-pause::after {
      position: absolute;
      top: 1px;
      width: 4px;
      height: 12px;
      content: &quot;&quot;;
      background: currentColor;
      border-radius: 2px;
    }

    .motion-glyph.is-pause::before {
      left: 1px;
    }

    .motion-glyph.is-pause::after {
      right: 1px;
    }

    .motion-glyph.is-play {
      width: 0;
      height: 0;
      margin-left: 2px;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 11px solid currentColor;
    }

    .scene-wrap {
      position: relative;
      background: #a9d5dd;
    }

    #scene {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 2;
    }

    .scene-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px clamp(18px, 4vw, 46px) 17px;
      background: var(--paper);
      border-top: 1px solid rgba(24, 53, 74, .12);
    }

    .footer-note {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 12px;
      font-weight: 750;
    }

    .footer-note::before {
      display: inline-block;
      width: 7px;
      height: 7px;
      content: &quot;&quot;;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(236, 112, 66, .14);
    }

    .footer-meta {
      color: var(--muted-ink);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-align: right;
      text-transform: uppercase;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* The scene uses only lightweight, transform/opacity-based motion. */
    [data-animated] {
      animation-fill-mode: both;
    }

    .scene.is-paused [data-animated] {
      animation-play-state: paused !important;
    }

    .scene.is-paused .wheel,
    .scene.is-paused .pedal-system,
    .scene.is-paused .rider-bob,
    .scene.is-paused .cloud,
    .scene.is-paused .sun-glow,
    .scene.is-paused .road-motion,
    .scene.is-paused .motion-streaks {
      animation-play-state: paused !important;
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin 1.25s linear infinite;
    }

    .pedal-system {
      transform-box: fill-box;
      transform-origin: center;
      animation: pedal-spin 1.25s linear infinite;
    }

    .rider-bob {
      transform-box: fill-box;
      transform-origin: center;
      animation: rider-bob 1.25s ease-in-out infinite;
    }

    .cloud {
      transform-box: view-box;
      animation: cloud-drift 19s linear infinite;
    }

    .cloud-b {
      animation-duration: 25s;
      animation-delay: -8s;
    }

    .sun-glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: sun-breathe 6s ease-in-out infinite;
    }

    .road-motion {
      animation: road-move 1.25s linear infinite;
    }

    .motion-streaks {
      animation: streak-pulse 1.25s ease-out infinite;
    }

    @keyframes wheel-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pedal-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes rider-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(-.45deg); }
    }

    @keyframes cloud-drift {
      from { transform: translateX(-24px); }
      to { transform: translateX(72px); }
    }

    @keyframes sun-breathe {
      0%, 100% { opacity: .84; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.045); }
    }

    @keyframes road-move {
      from { transform: translateX(0); }
      to { transform: translateX(-240px); }
    }

    @keyframes streak-pulse {
      0%, 100% { opacity: .25; transform: translateX(8px); }
      45% { opacity: .8; transform: translateX(-10px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene:not(.motion-allowed) [data-animated] {
        animation: none !important;
      }
    }

    @media (max-width: 640px) {
      .page {
        align-items: start;
        padding: 10px;
      }

      .artboard {
        border-radius: 18px;
      }

      .chrome {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .motion-toggle {
        min-height: 42px;
        padding: 0 14px;
        font-size: 12px;
      }

      .scene-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 9px;
      }

      .footer-meta {
        text-align: left;
      }
    }

    @media (max-width: 390px) {
      h1 span {
        display: block;
        margin: 7px 0 0;
        font-size: 10px;
        letter-spacing: .16em;
      }
    }

    /* Keep the whole illustration comfortably in view on common 1200x800 laptops. */
    @media (min-width: 900px) and (max-height: 850px) {
      .page {
        padding: 16px;
      }

      .artboard {
        width: min(960px, 100%);
      }

      .chrome {
        padding: 16px 30px 14px;
      }

      h1 {
        font-size: 34px;
      }

      .scene-footer {
        padding: 10px 30px 12px;
      }
    }

  &lt;script&gt;
    (() =&gt; {
      const scene = document.getElementById(&#39;scene&#39;);
      const toggle = document.getElementById(&#39;motionToggle&#39;);
      const label = document.getElementById(&#39;motionLabel&#39;);
      const glyph = document.getElementById(&#39;motionGlyph&#39;);
      const status = document.getElementById(&#39;motionStatus&#39;);
      const motionQuery = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
      let isPlaying = !motionQuery.matches;

      function renderMotionState() {
        scene.classList.toggle(&#39;is-paused&#39;, !isPlaying);
        scene.classList.toggle(&#39;motion-allowed&#39;, isPlaying);
        toggle.setAttribute(&#39;aria-pressed&#39;, String(isPlaying));
        toggle.setAttribute(&#39;aria-label&#39;, isPlaying ? &#39;暂停动画&#39; : &#39;播放动画&#39;);
        label.textContent = isPlaying ? &#39;暂停动画&#39; : &#39;播放动画&#39;;
        glyph.className = `motion-glyph ${isPlaying ? &#39;is-pause&#39; : &#39;is-play&#39;}`;
        status.textContent = isPlaying ? &#39;动画已播放&#39; : &#39;动画已暂停&#39;;
      }

      function toggleMotion() {
        isPlaying = !isPlaying;
        renderMotionState();
      }

      toggle.addEventListener(&#39;click&#39;, toggleMotion);

      window.addEventListener(&#39;keydown&#39;, (event) =&gt; {
        const activeElement = document.activeElement;
        const isFormField = activeElement &amp;&amp; (
          [&#39;INPUT&#39;, &#39;TEXTAREA&#39;, &#39;SELECT&#39;].includes(activeElement.tagName) ||
          activeElement.isContentEditable
        );

        if (event.code !== &#39;Space&#39; || event.repeat || isFormField) {
          return;
        }

        event.preventDefault();
        // Prevent the browser&#39;s native button activation and own the shortcut,
        // so Space toggles exactly once whether the button is focused or not.
        toggleMotion();
      });

      motionQuery.addEventListener?.(&#39;change&#39;, (event) =&gt; {
        if (event.matches) {
          isPlaying = false;
          renderMotionState();
        }
      });

      renderMotionState();
    })();
  &lt;/script&gt;
