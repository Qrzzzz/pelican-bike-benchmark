&lt;style&gt;
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;

  }
  html, body {

  }
  #toggleBtn:hover {
    background: #457b9d;
  }
  #toggleBtn:active {
    transform: scale(0.95);
  }
  #toggleBtn:focus {
    outline: 3px solid #f4a261;
    outline-offset: 2px;
  }

/* Animations */
.wheel-back { transform-origin: 250px 450px; animation: spin 1s linear infinite; }
.wheel-front { transform-origin: 450px 450px; animation: spin 1s linear infinite; }
.crank { transform-origin: 350px 450px; animation: spin 1s linear infinite; }
.road-lines { animation: roadMove 0.4s linear infinite; }
.clouds { animation: cloudMove 15s linear infinite; }
.mountains { animation: mountainMove 25s linear infinite; }
.pelican { animation: bounce 0.5s ease-in-out infinite alternate; }
.wing { transform-origin: 320px 280px; animation: flap 0.5s ease-in-out infinite alternate; }

@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes roadMove { 100% { stroke-dashoffset: -50; } }
@keyframes cloudMove { 100% { transform: translateX(-800px); } }
@keyframes mountainMove { 100% { transform: translateX(-800px); } }
@keyframes bounce { 100% { transform: translateY(-6px); } }
@keyframes flap { 100% { transform: rotate(-20deg); } }

.paused * { animation-play-state: paused !important; }

@media (prefers-reduced-motion: reduce) {
  .wheel-back, .wheel-front, .crank, .road-lines, .clouds, .mountains, .pelican, .wing { animation: none !important; }
}

@media (max-width: 600px) {
  #toggleBtn { padding: 8px 14px; font-size: 13px; top: 10px; right: 10px; }
}

  &lt;/g&gt;

  &lt;!-- Front Wheel --&gt;
  &lt;g class=&quot;wheel-front&quot;&gt;
    &lt;circle cx=&quot;450&quot; cy=&quot;450&quot; r=&quot;60&quot; fill=&quot;none&quot; stroke=&quot;#222&quot; stroke-width=&quot;8&quot;/&gt;
    &lt;circle cx=&quot;450&quot; cy=&quot;450&quot; r=&quot;52&quot; fill=&quot;none&quot; stroke=&quot;#444&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;line x1=&quot;450&quot; y1=&quot;390&quot; x2=&quot;450&quot; y2=&quot;510&quot; stroke=&quot;#888&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;line x1=&quot;390&quot; y1=&quot;450&quot; x2=&quot;510&quot; y2=&quot;450&quot; stroke=&quot;#888&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;line x1=&quot;407&quot; y1=&quot;407&quot; x2=&quot;493&quot; y2=&quot;493&quot; stroke=&quot;#888&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;line x1=&quot;493&quot; y1=&quot;407&quot; x2=&quot;407&quot; y2=&quot;493&quot; stroke=&quot;#888&quot; stroke-width=&quot;2&quot;/&gt;
    &lt;circle cx=&quot;450&quot; cy=&quot;450&quot; r=&quot;8&quot; fill=&quot;#222&quot;/&gt;

  &lt;!-- Frame --&gt;

  &lt;path d=&quot;M 350 450 L 410 340 L 310 340&quot; fill=&quot;none&quot; stroke=&quot;#e63946&quot; stroke-width=&quot;7&quot; stroke-linejoin=&quot;round&quot;/&gt;

    &lt;line x1=&quot;350&quot; y1=&quot;450&quot; x2=&quot;350&quot; y2=&quot;405&quot; stroke=&quot;#333&quot; stroke-width=&quot;6&quot; stroke-linecap=&quot;round&quot;/&gt;
    &lt;rect x=&quot;335&quot; y=&quot;400&quot; width=&quot;30&quot; height=&quot;10&quot; fill=&quot;#555&quot; rx=&quot;3&quot;/&gt;
    &lt;circle cx=&quot;350&quot; cy=&quot;450&quot; r=&quot;14&quot; fill=&quot;#333&quot;/&gt;
    &lt;circle cx=&quot;350&quot; cy=&quot;450&quot; r=&quot;6&quot; fill=&quot;#888&quot;/&gt;
  &lt;/g&gt;
&lt;/g&gt;

&lt;!-- Pelican --&gt;
&lt;g class=&quot;pelican&quot;&gt;
  &lt;!-- Legs --&gt;

  &lt;path d=&quot;M 405 215 Q 460 250 520 205&quot; fill=&quot;none&quot; stroke=&quot;#e76f51&quot; stroke-width=&quot;2.5&quot;/&gt;
&lt;/g&gt;

  &lt;/svg&gt;
&lt;/div&gt;

&lt;script&gt;
  const svg = document.querySelector(&#39;svg&#39;);
  const btn = document.getElementById(&#39;toggleBtn&#39;);
  let isPlaying = true;

  const mediaQuery = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
  if (mediaQuery.matches) {
    isPlaying = false;
    svg.classList.add(&#39;paused&#39;);
    btn.textContent = &#39;播放&#39;;
    btn.setAttribute(&#39;aria-label&#39;, &#39;播放动画&#39;);
  }

  function toggleAnimation() {
    isPlaying = !isPlaying;
    if (isPlaying) {
      svg.classList.remove(&#39;paused&#39;);
      btn.textContent = &#39;暂停&#39;;
      btn.setAttribute(&#39;aria-label&#39;, &#39;暂停动画&#39;);
    } else {
      svg.classList.add(&#39;paused&#39;);
      btn.textContent = &#39;播放&#39;;
      btn.setAttribute(&#39;aria-label&#39;, &#39;播放动画&#39;);
    }
  }

  btn.addEventListener(&#39;click&#39;, toggleAnimation);

  document.addEventListener(&#39;keydown&#39;, (e) =&gt; {
    if (e.code === &#39;Space&#39; || e.key === &#39; &#39;) {
      e.preventDefault();
      toggleAnimation();
    }
  });
&lt;/script&gt;

&lt;/body&gt;
