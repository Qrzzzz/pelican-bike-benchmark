            &lt;path d=&quot;M668 268Q689 279 716 271L714 283Q692 291 667 280Z&quot; fill=&quot;#bd704c&quot; stroke=&quot;#915839&quot; stroke-width=&quot;2&quot;/&gt;
            &lt;g id=&quot;scarf-tail&quot;&gt;
              &lt;path d=&quot;M670 277Q638 268 613 278L628 288L614 299Q646 296 675 284Z&quot; fill=&quot;#cc8055&quot; stroke=&quot;#915839&quot; stroke-width=&quot;2&quot; stroke-linejoin=&quot;round&quot;/&gt;
              &lt;path d=&quot;M628 280l32 1&quot; stroke=&quot;#e2a87a&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot;/&gt;
            &lt;/g&gt;
            &lt;path d=&quot;M670 276q12-4 10 7q-8 7-13-1Z&quot; fill=&quot;#af6343&quot; stroke=&quot;#915839&quot; stroke-width=&quot;1.5&quot;/&gt;
          &lt;/g&gt;
          &lt;path id=&quot;front-leg&quot; d=&quot;M596 374L679 452L645 542&quot; fill=&quot;none&quot; stroke=&quot;#dc9b58&quot; stroke-width=&quot;16&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;
          &lt;path id=&quot;leg-highlight&quot; d=&quot;M596 374L679 452L645 542&quot; fill=&quot;none&quot; stroke=&quot;#edba76&quot; stroke-width=&quot;4&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;

          &lt;g id=&quot;front-pedal&quot;&gt;
            &lt;rect x=&quot;-16&quot; y=&quot;-3&quot; width=&quot;32&quot; height=&quot;7&quot; rx=&quot;2&quot; fill=&quot;#294c48&quot;/&gt;

          &lt;use href=&quot;#grass&quot; transform=&quot;translate(141 601)&quot;/&gt;
          &lt;use href=&quot;#grass&quot; transform=&quot;translate(1046 607) scale(.8)&quot;/&gt;
          &lt;use href=&quot;#grass&quot; transform=&quot;translate(1341 601)&quot;/&gt;
          &lt;g transform=&quot;translate(233 610)&quot;&gt;
            &lt;path d=&quot;M0 0Q4-17 1-29&quot; fill=&quot;none&quot; stroke=&quot;#7e9978&quot; stroke-width=&quot;2.5&quot;/&gt;
            &lt;circle cx=&quot;1&quot; cy=&quot;-29&quot; r=&quot;5&quot; fill=&quot;#f4ecd0&quot;/&gt;
            &lt;circle cx=&quot;1&quot; cy=&quot;-29&quot; r=&quot;2&quot; fill=&quot;#d9a862&quot;/&gt;

    &lt;footer class=&quot;footer&quot;&gt;
      &lt;p class=&quot;caption&quot;&gt;慢一点，也在向前。&lt;/p&gt;
      &lt;div class=&quot;route&quot;&gt;&lt;span class=&quot;route-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;海岸线 · 轻松骑行&lt;/div&gt;
    &lt;/footer&gt;
  &lt;/main&gt;
  &lt;script&gt;
    (() =&gt; {
      &#39;use strict&#39;;
      const byId = id =&gt; document.getElementById(id);
      const button = byId(&#39;toggle&#39;);
      const label = byId(&#39;button-label&#39;);
      const illustration = byId(&#39;illustration&#39;);
      const reducedMotion = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
      const narrowScreen = window.matchMedia(&#39;(max-width: 640px)&#39;);
      const parts = {
        rear: byId(&#39;rear-spokes&#39;), front: byId(&#39;front-spokes&#39;), crank: byId(&#39;crank&#39;),
        backLeg: byId(&#39;back-leg&#39;), frontLeg: byId(&#39;front-leg&#39;), highlight: byId(&#39;leg-highlight&#39;),
        backFoot: byId(&#39;back-foot&#39;), frontFoot: byId(&#39;front-foot&#39;),
        backPedal: byId(&#39;back-pedal&#39;), frontPedal: byId(&#39;front-pedal&#39;), rider: byId(&#39;rider&#39;),
        scarf: byId(&#39;scarf-tail&#39;), road: byId(&#39;road-marks&#39;), clouds: byId(&#39;clouds&#39;),
        water: byId(&#39;water&#39;), foreground: byId(&#39;foreground&#39;)
      };
      let playing = false;
      let elapsed = 0;
      let lastTime = null;
      let frameId = null;
      const number = value =&gt; value.toFixed(2);

      function legPath(hipX, hipY, footX, footY) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const upper = 112;
        const lower = 112;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / distance + bend * dy / distance;
        const kneeY = hipY + along * dy / distance - bend * dx / distance;
        return `M${hipX} ${hipY}L${number(kneeX)} ${number(kneeY)}L${number(footX)} ${number(footY)}`;
      }

      function render() {
        const angle = elapsed * Math.PI * 2 / 1.7;
        const degrees = angle * 180 / Math.PI;
        const pedalX = Math.cos(angle) * 29;
        const pedalY = Math.sin(angle) * 29;
        const frontX = 620 + pedalX;
        const frontY = 542 + pedalY;
        const backX = 620 - pedalX;
        const backY = 542 - pedalY;
        const frontPath = legPath(596, 374, frontX, frontY - 5);
        parts.frontLeg.setAttribute(&#39;d&#39;, frontPath);
        parts.highlight.setAttribute(&#39;d&#39;, frontPath);
        parts.backLeg.setAttribute(&#39;d&#39;, legPath(572, 369, backX, backY - 5));
        parts.frontFoot.setAttribute(&#39;transform&#39;, `translate(${number(frontX)} ${number(frontY - 3)})`);
        parts.backFoot.setAttribute(&#39;transform&#39;, `translate(${number(backX)} ${number(backY - 3)})`);
        parts.frontPedal.setAttribute(&#39;transform&#39;, `translate(${number(frontX)} ${number(frontY)})`);
        parts.backPedal.setAttribute(&#39;transform&#39;, `translate(${number(backX)} ${number(backY)})`);
        parts.crank.setAttribute(&#39;transform&#39;, `translate(620 542) rotate(${number(degrees % 360)})`);
        const wheelDegrees = (degrees * 1.7) % 360;
        parts.rear.setAttribute(&#39;transform&#39;, `rotate(${number(wheelDegrees)})`);
        parts.front.setAttribute(&#39;transform&#39;, `rotate(${number(wheelDegrees)})`);
        parts.rider.setAttribute(&#39;transform&#39;, `translate(0 ${number(Math.sin(angle * 2) * 1.5)})`);
        parts.scarf.setAttribute(&#39;transform&#39;, `rotate(${number(Math.sin(angle * 1.3) * 3)} 673 281)`);
        parts.road.setAttribute(&#39;transform&#39;, `translate(${number(-(elapsed * 105) % 220)} 0)`);
        parts.clouds.setAttribute(&#39;transform&#39;, `translate(${number(Math.sin(elapsed * .08) * 22)} 0)`);
        parts.water.setAttribute(&#39;transform&#39;, `translate(${number(-(elapsed * 7) % 1200)} 0)`);
        parts.foreground.setAttribute(&#39;transform&#39;, `translate(${number(-(elapsed * 105) % 1200)} 0)`);
      }

      function tick(time) {
        frameId = null;
        if (!playing || document.hidden) return;
        if (lastTime !== null) elapsed += Math.min((time - lastTime) / 1000, .05);
        lastTime = time;
        render();
        frameId = requestAnimationFrame(tick);
      }

      function stopFrame() {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        lastTime = null;
      }

      function setPlaying(value) {
        playing = value;
        document.body.dataset.playing = String(value);
        button.setAttribute(&#39;aria-pressed&#39;, String(value));
        button.setAttribute(&#39;aria-label&#39;, value ? &#39;暂停动画&#39; : &#39;播放动画&#39;);
        label.textContent = value ? &#39;暂停动画&#39; : &#39;播放动画&#39;;
        stopFrame();
        if (playing &amp;&amp; !document.hidden) frameId = requestAnimationFrame(tick);
      }

      function resizeScene() {
        illustration.setAttribute(&#39;viewBox&#39;, narrowScreen.matches ? &#39;315 40 650 650&#39; : &#39;0 30 1200 650&#39;);
      }

      button.addEventListener(&#39;click&#39;, () =&gt; setPlaying(!playing));
      document.addEventListener(&#39;keydown&#39;, event =&gt; {
        if (event.code !== &#39;Space&#39; &amp;&amp; event.key !== &#39; &#39;) return;
        const target = event.target;
        if (target instanceof HTMLElement &amp;&amp;
            (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName))) return;
        event.preventDefault();
        if (!event.repeat) setPlaying(!playing);
      });
      document.addEventListener(&#39;visibilitychange&#39;, () =&gt; {
        stopFrame();
        if (playing &amp;&amp; !document.hidden) frameId = requestAnimationFrame(tick);
      });
      reducedMotion.addEventListener(&#39;change&#39;, event =&gt; {
        if (event.matches) setPlaying(false);
      });
      narrowScreen.addEventListener(&#39;change&#39;, resizeScene);
      resizeScene();
      render();
      setPlaying(!reducedMotion.matches);
    })();
  &lt;/script&gt;
&lt;/body&gt;
