  &lt;style&gt;
    :root {
      color-scheme: light;
      --sky-top: #86c6ec;
      --sky-mid: #bde7f7;
      --sky-low: #f7e8bd;
      --ink: #1f2d37;
      --road: #5e6970;
      --rim: #263741;
      --frame: #1a7a83;
      --accent: #f08a42;
      --button-bg: rgba(255, 255, 255, 0.86);
      --button-bg-hover: rgba(255, 255, 255, 0.96);
      --button-border: rgba(31, 45, 55, 0.22);
      --focus: #0b66d8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 46%, var(--sky-low) 68%, #8fbf7e 68%, #5c8a66 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      color: var(--ink);
    }

    .stage {
      position: relative;
      width: 100vw;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .scene {
      width: 100%;
      height: 100svh;
      min-height: 520px;
      display: block;
    }

    .control {
      position: fixed;
      z-index: 10;
      top: clamp(12px, 2vw, 24px);
      left: clamp(12px, 2vw, 24px);
      display: inline-flex;
      align-items: center;
      gap: 0.58rem;
      min-height: 44px;
      max-width: calc(100vw - 24px);
      padding: 0.72rem 0.95rem;
      border: 1px solid var(--button-border);
      border-radius: 8px;
      background: var(--button-bg);
      color: var(--ink);
      box-shadow: 0 12px 30px rgba(34, 54, 66, 0.16);
      font: 700 clamp(0.92rem, 1.8vw, 1rem) / 1.1 system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .control:hover {
      background: var(--button-bg-hover);
    }

    .control:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .control-icon {
      width: 1.05rem;
      height: 1.05rem;
      flex: 0 0 auto;
    }

    .control-label {
      white-space: nowrap;
    }

    .sun-core {
      fill: #ffe082;

    .sun-glow {

      opacity: 0.45;

    .cloud {

    .near-hill {
      fill: #679f6c;
    }

    .road {

    }

    .road-edge {
      fill: #76858d;
    }

    .lane {
      fill: #f9e9a8;
      opacity: 0.9;
    }

    .grass {
      stroke: #487954;
      stroke-width: 4;
      stroke-linecap: round;
      opacity: 0.58;
    }

    .speed-line {
      stroke: rgba(255, 255, 255, 0.78);
      stroke-width: 6;
      stroke-linecap: round;
      opacity: 0.7;
    }

    .bike-frame {
      fill: none;
      stroke: var(--frame);
      stroke-width: 17;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .bike-fork {
      fill: none;
      stroke: #1e5965;
      stroke-width: 12;
      stroke-linecap: round;
    }

    .wheel-rim {
      fill: none;
      stroke: var(--rim);
      stroke-width: 15;
    }

    .wheel-tire {
      fill: none;
      stroke: #111b21;
      stroke-width: 22;
    }

    .wheel-hub {
      fill: #f3f7f4;
      stroke: #17262d;
      stroke-width: 6;
    }

    .spokes line {
      stroke: rgba(255, 255, 255, 0.76);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .crank {
      stroke: #263741;
      stroke-width: 9;
      stroke-linecap: round;
    }

    .pedal {
      fill: #263741;
    }

    .seat {
      fill: #263741;
    }

    .handlebar {
      fill: none;
      stroke: #263741;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pelican-body {
      fill: #f8f4df;
      stroke: #263741;
      stroke-width: 5;
    }

    .pelican-belly {
      fill: #fff9eb;
      opacity: 0.72;
    }

    .wing {
      fill: #d8d0b9;
      stroke: #263741;
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .wing-feather {
      fill: none;
      stroke: #958f7f;
      stroke-width: 4;
      stroke-linecap: round;
    }

    .neck {
      fill: #f6f0d8;
      stroke: #263741;
      stroke-width: 5;
    }

    .head {
      fill: #fbf6e6;
      stroke: #263741;
      stroke-width: 5;
    }

    .cap-feathers {
      fill: none;
      stroke: #263741;
      stroke-width: 5;
      stroke-linecap: round;
    }

    .beak-top {
      fill: #f7b34c;
      stroke: #263741;
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .throat-pouch {
      fill: #f5cf8a;
      stroke: #263741;
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .pouch-shade {
      fill: #e5ad63;

    .eye-white {
      fill: #fff;
      stroke: #263741;
      stroke-width: 3;
    }

    .eye-pupil {

    }

    .leg {
      stroke: #e6a647;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .foot {
      fill: #e6a647;
      stroke: #263741;
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .shadow {
      fill: rgba(14, 26, 31, 0.22);
    }

    .paint-line {
      fill: none;
      stroke: rgba(38, 55, 65, 0.2);
      stroke-width: 3;
      stroke-linecap: round;
    }

    @media (max-width: 700px) {
      .scene {

  &lt;script&gt;
    (() =&gt; {
      &quot;use strict&quot;;

      const reduceMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
      const button = document.querySelector(&quot;.control&quot;);
      const label = button.querySelector(&quot;.control-label&quot;);
      const icon = button.querySelector(&quot;.control-icon&quot;);
      const riderBike = document.querySelector(&quot;.rider-bike&quot;);
      const pelican = document.querySelector(&quot;.pelican&quot;);
      const bodyGroup = document.querySelector(&quot;.body-group&quot;);
      const headGroup = document.querySelector(&quot;.head-group&quot;);
      const wingGroup = document.querySelector(&quot;.wing-group&quot;);
      const rearWheel = document.querySelector(&quot;.rear-wheel .spokes&quot;);
      const frontWheel = document.querySelector(&quot;.front-wheel .spokes&quot;);
      const crankSet = document.querySelector(&quot;.crank-set&quot;);
      const legFront = document.querySelector(&quot;.leg-front&quot;);
      const legBack = document.querySelector(&quot;.leg-back&quot;);
      const roadLines = document.querySelector(&quot;.road-lines&quot;);
      const speedLines = document.querySelector(&quot;.speed-lines&quot;);
      const grass = document.querySelector(&quot;.moving-grass&quot;);
      const parallax = document.querySelector(&quot;.parallax-slow&quot;);

      const state = {
        playing: !reduceMotion.matches,
        start: 0,
        elapsed: 0,
        frame: 0
      };

      function setTransform(element, value) {
        element.setAttribute(&quot;transform&quot;, value);
      }

      function setButton() {
        button.setAttribute(&quot;aria-pressed&quot;, String(state.playing));
        button.setAttribute(&quot;aria-label&quot;, state.playing ? &quot;暂停动画&quot; : &quot;播放动画&quot;);
        label.textContent = state.playing ? &quot;暂停&quot; : &quot;播放&quot;;
        icon.innerHTML = state.playing
          ? &#39;&lt;path d=&quot;M7 5h3.4v14H7zM13.6 5H17v14h-3.4z&quot; fill=&quot;currentColor&quot;&gt;&lt;/path&gt;&#39;
          : &#39;&lt;path d=&quot;M7.5 4.6v14.8L18.8 12 7.5 4.6z&quot; fill=&quot;currentColor&quot;&gt;&lt;/path&gt;&#39;;
      }

      function render(ms) {
        const t = ms / 1000;
        const wheelAngle = -t * 430;
        const crankAngle = t * 360;
        const bob = Math.sin(t * Math.PI * 2) * 7;
        const sway = Math.sin(t * Math.PI * 2 + 0.7) * 2.4;
        const wing = Math.sin(t * Math.PI * 2 + 0.4) * 5;
        const head = Math.sin(t * Math.PI * 2 + 1.1) * 3.5;
        const ground = -(t * 180 % 260);
        const grassX = -(t * 96 % 160);
        const slow = -(t * 14 % 90);
        const dash = -(t * 260 % 280);

        setTransform(rearWheel, `rotate(${wheelAngle})`);
        setTransform(frontWheel, `rotate(${wheelAngle})`);
        setTransform(crankSet, `translate(650 650) rotate(${crankAngle})`);
        setTransform(riderBike, `translate(0 ${bob}) rotate(${sway} 620 535)`);
        setTransform(pelican, `translate(0 ${Math.sin(t * Math.PI * 2 + 0.3) * 3})`);
        setTransform(bodyGroup, `rotate(${sway * 0.7} 638 446)`);
        setTransform(headGroup, `rotate(${head} 900 305)`);
        setTransform(wingGroup, `rotate(${wing} 596 443)`);
        setTransform(legFront, `rotate(${Math.sin(t * Math.PI * 2 + Math.PI) * 9} 650 650)`);
        setTransform(legBack, `rotate(${Math.sin(t * Math.PI * 2) * 9} 650 650)`);
        setTransform(roadLines, `translate(${ground} 0)`);
        setTransform(grass, `translate(${grassX} 0)`);
        setTransform(parallax, `translate(${slow} 0)`);
        setTransform(speedLines, `translate(${dash} 0)`);
      }

      function step(now) {
        if (!state.playing) {
          state.frame = 0;
          return;
        }

        if (!state.start) {
          state.start = now - state.elapsed;
        }

        state.elapsed = now - state.start;
        render(state.elapsed);
        state.frame = window.requestAnimationFrame(step);
      }

      function play() {
        if (state.playing) {
          return;
        }
        state.playing = true;
        state.start = 0;
        setButton();
        state.frame = window.requestAnimationFrame(step);
      }

      function pause() {
        if (!state.playing) {
          return;
        }
        state.playing = false;
        window.cancelAnimationFrame(state.frame);
        setButton();
      }

      function toggle() {
        if (state.playing) {
          pause();
        } else {
          play();
        }
      }

      button.addEventListener(&quot;click&quot;, toggle);

      window.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        const tag = event.target &amp;&amp; event.target.tagName;
        const typing = tag === &quot;INPUT&quot; || tag === &quot;TEXTAREA&quot; || tag === &quot;SELECT&quot; || event.target?.isContentEditable;
        if (event.code === &quot;Space&quot; &amp;&amp; !typing) {
          event.preventDefault();
          toggle();
        }
      });

      reduceMotion.addEventListener(&quot;change&quot;, (event) =&gt; {
        if (event.matches) {
          pause();
        } else if (!state.playing &amp;&amp; state.elapsed === 0) {
          play();
        }
      });

      setButton();
      render(0);

      if (state.playing) {
        state.frame = window.requestAnimationFrame(step);
      }
    })();
  &lt;/script&gt;
