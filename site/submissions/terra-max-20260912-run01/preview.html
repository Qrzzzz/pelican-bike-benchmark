  &lt;style&gt;
    :root {
      color-scheme: light;
      font-family: ui-rounded, &quot;SF Pro Rounded&quot;, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;
      background: #d9f2f2;
      color: #102b3a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 0;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 12px;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.82), transparent 25rem),
        linear-gradient(150deg, #dff6f1 0%, #a9dfeb 100%);
    }

    main {
      width: 100%;
      display: grid;
      place-items: center;
    }

    .scene-card {
      position: relative;
      width: min(100%, 1200px, calc(150svh - 36px));
      aspect-ratio: 3 / 2;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(18, 80, 101, 0.18);
      border-radius: clamp(18px, 3vw, 32px);
      box-shadow:
        0 26px 70px rgba(33, 102, 122, 0.24),
        0 5px 18px rgba(19, 71, 91, 0.16);
      background: #77cfe4;
    }

    .scene-card::after {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      content: &quot;&quot;;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      position: absolute;
      z-index: 4;
      left: clamp(12px, 2.2vw, 26px);
      bottom: clamp(12px, 2.2vw, 26px);
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 7px 10px 7px 7px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      background: rgba(10, 40, 54, 0.79);
      color: #fff;
      box-shadow: 0 10px 20px rgba(11, 43, 55, 0.2);
      backdrop-filter: blur(12px);
    }

    button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 9px 15px;
      border: 0;
      border-radius: 999px;
      color: #112e3b;
      background: #fff7d5;
      box-shadow: 0 2px 0 #d6b56b;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 4px 0 #d6b56b;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 #d6b56b;
    }

    button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
      box-shadow: 0 0 0 6px #13465a;
    }

    .button-icon {
      width: 1.1em;
      display: inline-block;
      font-size: 1.1em;
      line-height: 1;
      text-align: center;
    }

    .shortcut {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    kbd {
      display: inline-block;
      margin-right: 3px;
      padding: 2px 5px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 5px;
      font: inherit;
      font-size: 0.9em;
      background: rgba(255, 255, 255, 0.12);
    }

    .wheel,
    .crank {
      transform-box: fill-box;
      transform-origin: center;
    }

    .wing {
      transform-box: view-box;
      transform-origin: 533px 388px;
    }

    .leg--back {
      transform-box: view-box;
      transform-origin: 548px 460px;
    }

    .leg--front {
      transform-box: view-box;
      transform-origin: 600px 462px;
    }

    .scene-card.is-playing .wheel {
      animation: wheel-spin 1.18s linear infinite;
    }

    .scene-card.is-playing .wheel--front {
      animation-delay: -0.14s;
    }

    .scene-card.is-playing .crank {
      animation: wheel-spin 1.18s linear infinite;
    }

    .scene-card.is-playing .pelican-rider {
      animation: rider-bob 1.18s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    .scene-card.is-playing .wing {
      animation: wing-flutter 1.18s ease-in-out infinite;
    }

    .scene-card.is-playing .leg--back {
      animation: back-leg 1.18s ease-in-out infinite;
    }

    .scene-card.is-playing .leg--front {
      animation: front-leg 1.18s ease-in-out infinite;
    }

    .scene-card.is-playing .cloud--one {
      animation: cloud-left 12s linear infinite;
    }

    .scene-card.is-playing .cloud--two {
      animation: cloud-right 17s linear infinite;
    }

    .scene-card.is-playing .road-dashes {
      animation: road-flow 0.75s linear infinite;
    }

    .scene-card.is-playing .grass-streaks {
      animation: grass-flow 0.92s linear infinite;
    }

    .scene-card.is-playing .sun-rays {
      animation: rays-turn 18s linear infinite;
    }

    @keyframes wheel-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rider-bob {
      0%,
      100% {
        transform: translateY(0) rotate(-0.35deg);
      }

      50% {
        transform: translateY(-8px) rotate(0.55deg);
      }
    }

    @keyframes wing-flutter {
      0%,
      100% {
        transform: rotate(0);
      }

      50% {
        transform: rotate(3deg) translateY(-2px);
      }
    }

    @keyframes back-leg {
      0%,
      100% {
        transform: rotate(-3deg);
      }

      50% {
        transform: rotate(6deg);
      }
    }

    @keyframes front-leg {
      0%,
      100% {
        transform: rotate(4deg);
      }

      50% {
        transform: rotate(-5deg);
      }
    }

    @keyframes cloud-left {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-92px);
      }
    }

    @keyframes cloud-right {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(105px);
      }
    }

    @keyframes road-flow {
      to {
        stroke-dashoffset: -170px;
      }
    }

    @keyframes grass-flow {
      to {
        stroke-dashoffset: -110px;
      }
    }

    @keyframes rays-turn {
      to {
        transform: rotate(360deg);
        transform-origin: 973px 134px;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 8px;
      }

      .scene-card {
        border-radius: 18px;
      }

      .controls {
        left: 10px;
        bottom: 10px;
        gap: 0;
        padding: 5px;
      }

      button {
        min-height: 42px;
        padding: 8px 12px;
        font-size: 0.82rem;
      }

      .shortcut {
        display: none;
      }
    }

  &lt;script&gt;
    (() =&gt; {
      const scene = document.getElementById(&quot;scene&quot;);
      const toggle = document.getElementById(&quot;motion-toggle&quot;);
      const label = document.getElementById(&quot;button-label&quot;);
      const icon = document.getElementById(&quot;button-icon&quot;);
      const mediaQuery = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
      let isPlaying = !mediaQuery.matches;

      const setPlaying = (nextState) =&gt; {
        isPlaying = nextState;
        scene.classList.toggle(&quot;is-playing&quot;, isPlaying);
        toggle.setAttribute(&quot;aria-pressed&quot;, String(isPlaying));
        label.textContent = isPlaying ? &quot;暂停动画&quot; : &quot;播放动画&quot;;
        icon.textContent = isPlaying ? &quot;Ⅱ&quot; : &quot;▶&quot;;
      };

      toggle.addEventListener(&quot;click&quot;, () =&gt; {
        setPlaying(!isPlaying);
      });

      toggle.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.code === &quot;Space&quot;) {
          event.preventDefault();
          if (!event.repeat) {
            setPlaying(!isPlaying);
          }
        }
      });

      document.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.code !== &quot;Space&quot; || event.repeat || event.target === toggle) {
          return;
        }

        const target = event.target;
        if (
          target instanceof HTMLInputElement ||
          target instanceof HTMLTextAreaElement ||
          target instanceof HTMLSelectElement ||
          target.isContentEditable
        ) {
          return;
        }

        event.preventDefault();
        setPlaying(!isPlaying);
      });

      const onMotionPreferenceChange = (event) =&gt; {
        if (event.matches) {
          setPlaying(false);
        }
      };

      if (typeof mediaQuery.addEventListener === &quot;function&quot;) {
        mediaQuery.addEventListener(&quot;change&quot;, onMotionPreferenceChange);
      } else {
        mediaQuery.addListener(onMotionPreferenceChange);
      }

      setPlaying(isPlaying);
    })();
  &lt;/script&gt;
