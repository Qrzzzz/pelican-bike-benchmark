  &lt;title&gt;骑自行车的鹈鹕&lt;/title&gt;
  &lt;style&gt;
    :root {
      color-scheme: light;
      --ink: #183246;
      --sky-top: #86d5f5;
      --sky-low: #d9f2f2;
      --sun: #ffcf5e;
      --cloud: rgba(255, 255, 255, .82);
      --road: #58616b;
      --road-light: #707b86;
      --grass: #4fb06f;
      --grass-dark: #25875a;
      --pelican: #f7f4e8;
      --pelican-shadow: #e0dccd;
      --beak: #f1a13c;
      --pouch: #ffd18b;
      --bike: #20475d;
      --accent: #dc5b48;
      --motion: running;
      --button-bg: rgba(255, 255, 255, .86);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: #d9f2f2;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
    }

    body.is-paused {
      --motion: paused;
    }

    body.is-playing {
      --motion: running;
    }

    .scene-shell {
      position: relative;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2.5vw, 28px);
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 255, 255, .65), transparent 21rem),
        linear-gradient(180deg, var(--sky-top), var(--sky-low) 58%, #8ad38f 58%, #52b776 100%);
    }

    .frame {
      width: min(100%, 1200px);
      aspect-ratio: 3 / 2;
      min-height: min(800px, calc(100svh - 24px));
      max-height: calc(100svh - 24px);
      border-radius: 0;
      box-shadow: 0 24px 70px rgba(20, 65, 84, .22);
      overflow: hidden;
      background: #bfeafa;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .control {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      top: max(14px, env(safe-area-inset-top));
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      min-height: 44px;
      padding: .7rem .95rem;
      border: 2px solid rgba(24, 50, 70, .18);
      border-radius: 999px;
      background: var(--button-bg);
      color: var(--ink);
      font: 700 clamp(.94rem, 1.4vw, 1rem) / 1 system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(24, 50, 70, .2);
      backdrop-filter: blur(10px);
    }

    .control:focus-visible {
      outline: 4px solid #ffffff;
      outline-offset: 3px;
      border-color: #183246;
      box-shadow: 0 0 0 7px rgba(24, 50, 70, .28);
    }

    .icon {
      width: 1.05rem;
      height: 1.05rem;
      position: relative;
      flex: 0 0 auto;
    }

    .icon::before,
    .icon::after {
      content: &quot;&quot;;
      position: absolute;
      inset-block: 0;
      background: currentColor;
      border-radius: 2px;
    }

    .icon::before {
      left: .18rem;
      width: .24rem;
    }

    .icon::after {
      right: .18rem;
      width: .24rem;
    }

    body.is-paused .icon::before {
      left: .22rem;
      width: 0;
      height: 0;
      top: 0;
      bottom: auto;
      border-top: .53rem solid transparent;
      border-bottom: .53rem solid transparent;
      border-left: .78rem solid currentColor;
      background: transparent;
      border-radius: 0;
    }

    body.is-paused .icon::after {
      display: none;
    }

    .wind path,
    .clouds,
    .road-marks,
    .grass-streaks,
    .bird,
    .body-bob,
    .head-bob,
    .wing,
    .legs,
    .wheel,
    .crank,
    .pedal {
      animation-play-state: var(--motion);
    }

    .clouds {
      animation: drift 18s linear infinite;
    }

    .road-marks {
      animation: road 1.5s linear infinite;
    }

    .grass-streaks {
      animation: road 2.2s linear infinite;
    }

    .bird {
      transform-origin: 650px 390px;
      animation: ride 1.15s ease-in-out infinite;
    }

    .body-bob {
      animation: bodyBob 1.15s ease-in-out infinite;
    }

    .head-bob {
      transform-origin: 735px 260px;
      animation: headBob 1.15s ease-in-out infinite;
    }

    .wing {
      transform-origin: 611px 319px;
      animation: wingBeat 1.15s ease-in-out infinite;
    }

    .legs {
      transform-origin: 621px 440px;
      animation: legPump 1.15s ease-in-out infinite;
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin .72s linear infinite;
    }

    .crank {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin .72s linear infinite;
    }

    .pedal {
      transform-box: fill-box;
      transform-origin: center;
      animation: counterSpin .72s linear infinite;
    }

    .wind path {
      animation: wind 2.2s ease-in-out infinite;
    }

    .wind path:nth-child(2) {
      animation-delay: -.7s;
    }

    .wind path:nth-child(3) {
      animation-delay: -1.35s;
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(-360px); }
    }

    @keyframes road {
      from { transform: translateX(0); }
      to { transform: translateX(-220px); }
    }

    @keyframes ride {
      0%, 100% { transform: translateY(0) rotate(-.35deg); }
      50% { transform: translateY(-9px) rotate(.25deg); }
    }

    @keyframes bodyBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }

    @keyframes headBob {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-2.3deg); }
    }

    @keyframes wingBeat {
      0%, 100% { transform: rotate(7deg); }
      50% { transform: rotate(-8deg) translateY(2px); }
    }

    @keyframes legPump {
      0%, 100% { transform: skewX(-2deg); }
      50% { transform: skewX(7deg); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes counterSpin {
      to { transform: rotate(-360deg); }
    }

    @keyframes wind {
      0%, 100% { opacity: .15; transform: translateX(45px); }
      40% { opacity: .8; }
      70% { opacity: .3; transform: translateX(-25px); }
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --motion: paused;
      }
    }

    @media (max-width: 700px) {
      .scene-shell {
        align-items: center;
        padding: 0;
      }

      .frame {
        width: 100vw;
        min-height: 100svh;
        max-height: none;
        aspect-ratio: auto;
        box-shadow: none;
      }

      svg {
        height: 100svh;
      }

      .control {
        left: max(12px, env(safe-area-inset-left));
        right: auto;
        top: max(12px, env(safe-area-inset-top));
        padding: .68rem .86rem;
      }
    }

  &lt;script&gt;
    (() =&gt; {
      const button = document.querySelector(&quot;.control&quot;);
      const label = button.querySelector(&quot;.label&quot;);
      const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);

      const setPlaying = (playing) =&gt; {
        document.body.classList.toggle(&quot;is-paused&quot;, !playing);
        document.body.classList.toggle(&quot;is-playing&quot;, playing);
        button.setAttribute(&quot;aria-pressed&quot;, String(playing));
        button.setAttribute(&quot;aria-label&quot;, playing ? &quot;暂停动画&quot; : &quot;播放动画&quot;);
        label.textContent = playing ? &quot;暂停&quot; : &quot;播放&quot;;
      };

      setPlaying(!reducedMotion.matches);

      button.addEventListener(&quot;click&quot;, () =&gt; {
        setPlaying(document.body.classList.contains(&quot;is-paused&quot;));
      });

      window.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        const isSpace = event.code === &quot;Space&quot; || event.key === &quot; &quot;;
        const editable = event.target instanceof HTMLElement &amp;&amp;
          (event.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(event.target.tagName));
        if (!isSpace || editable) return;
        event.preventDefault();
        setPlaying(document.body.classList.contains(&quot;is-paused&quot;));
      });

      reducedMotion.addEventListener(&quot;change&quot;, (event) =&gt; {
        setPlaying(!event.matches);
      });
    })();
  &lt;/script&gt;
&lt;/body&gt;
