&lt;style&gt;
  :root {
    --sky-top: #7ec8e8;
    --sky-mid: #b8e0f0;
    --sky-bot: #e8f4f8;
    --sun: #ffe08a;
    --road: #5a6570;
    --road-line: #f0e6c8;
    --grass: #6aab5a;
    --grass-dark: #4f8f42;
    --btn-bg: #1e3a4c;
    --btn-fg: #f5fafc;
    --btn-focus: #ffb347;
    --shadow: rgba(30, 50, 70, 0.25);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bot) 100%);
    color: #1a2a33;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    padding: 0.75rem;
  }

  h1 {
    font-size: clamp(1rem, 2.5vw, 1.35rem);
    font-weight: 650;
    letter-spacing: 0.02em;
    text-align: center;
    margin: 0.25rem 0 0.5rem;
    color: #163040;
  }

  .stage-wrap {
    width: min(100%, 1200px);
    aspect-ratio: 1200 / 800;
    max-height: calc(100dvh - 5.5rem);
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px var(--shadow), 0 2px 8px rgba(0,0,0,0.08);
    background: linear-gradient(180deg, #6eb8dc 0%, #a8d8ec 38%, #d4ebf2 62%, #8bc46a 62%, #6aab5a 100%);
  }

  .scene {
    width: 100%;
    height: 100%;
    display: block;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    margin-top: 0.75rem;
    flex-wrap: wrap;
  }

  #toggleBtn {
    appearance: none;
    border: 2px solid transparent;
    background: var(--btn-bg);
    color: var(--btn-fg);
    font: inherit;
    font-size: 1rem;
    font-weight: 600;
    padding: 0.55rem 1.25rem;
    border-radius: 999px;
    cursor: pointer;
    min-width: 7.5rem;
    min-height: 2.75rem;
    box-shadow: 0 4px 14px rgba(30, 58, 76, 0.35);
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  #toggleBtn:hover {
    background: #2a5168;
    transform: translateY(-1px);
  }

  #toggleBtn:active {
    transform: translateY(1px);
  }

  #toggleBtn:focus-visible {
    outline: 3px solid var(--btn-focus);
    outline-offset: 3px;
  }

  .hint {
    font-size: 0.85rem;
    color: #3a5566;
    opacity: 0.9;
  }

  /* Animation classes */
  .is-playing .wheel {
    animation: spin 1.1s linear infinite;
  }

  .is-playing .pedal-crank {
    animation: spin 1.1s linear infinite;
  }

  .is-playing .rider-group {
    animation: bob 0.55s ease-in-out infinite alternate;
  }

  .is-playing .wing {
    animation: flap 0.7s ease-in-out infinite alternate;
  }

  .is-playing .leg-push {
    animation: legPush 1.1s ease-in-out infinite;
  }

  .is-playing .cloud {
    animation: drift 28s linear infinite;
  }

  .is-playing .cloud-slow {
    animation: drift 42s linear infinite;
  }

  .is-playing .road-dash {
    animation: roadMove 1.2s linear infinite;
  }

  .is-playing .hill {
    animation: hillDrift 36s linear infinite;
  }

  .is-playing .sun-glow {
    animation: pulse 3.5s ease-in-out infinite alternate;
  }

  .is-playing .beak-bob {
    animation: beakNod 1.8s ease-in-out infinite alternate;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes bob {
    from { transform: translateY(0); }
    to { transform: translateY(-6px); }
  }

  @keyframes flap {
    from { transform: rotate(-6deg); }
    to { transform: rotate(10deg); }
  }

  @keyframes legPush {
    0%, 100% { transform: rotate(-18deg); }
    50% { transform: rotate(22deg); }
  }

  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(-1200px); }
  }

  @keyframes roadMove {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -48; }
  }

  @keyframes hillDrift {
    from { transform: translateX(0); }
    to { transform: translateX(-600px); }
  }

  @keyframes pulse {
    from { opacity: 0.55; }
    to { opacity: 0.9; }
  }

  @keyframes beakNod {
    from { transform: rotate(-2deg); }
    to { transform: rotate(3deg); }
  }

  @media (max-width: 640px) {
    body { padding: 0.5rem; }
    .stage-wrap {
      border-radius: 12px;
      max-height: calc(100dvh - 6.5rem);
    }
    .hint { font-size: 0.75rem; text-align: center; }
  }

    &lt;button type=&quot;button&quot; id=&quot;toggleBtn&quot; aria-pressed=&quot;true&quot;&gt;暂停&lt;/button&gt;
    &lt;span class=&quot;hint&quot;&gt;空格键也可播放 / 暂停&lt;/span&gt;
  &lt;/div&gt;

&lt;script&gt;
(function () {
  const stage = document.getElementById(&#39;stage&#39;);
  const btn = document.getElementById(&#39;toggleBtn&#39;);
  const reduceMotion = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);

  let playing = !reduceMotion.matches;

  function sync() {
    stage.classList.toggle(&#39;is-playing&#39;, playing);
    btn.setAttribute(&#39;aria-pressed&#39;, playing ? &#39;true&#39; : &#39;false&#39;);
    btn.textContent = playing ? &#39;暂停&#39; : &#39;播放&#39;;
  }

  function toggle() {
    playing = !playing;
    sync();
  }

  btn.addEventListener(&#39;click&#39;, toggle);

  window.addEventListener(&#39;keydown&#39;, function (e) {
    if (e.code === &#39;Space&#39; || e.key === &#39; &#39;) {
      const tag = (e.target &amp;&amp; e.target.tagName) || &#39;&#39;;
      if (tag === &#39;INPUT&#39; || tag === &#39;TEXTAREA&#39; || tag === &#39;SELECT&#39;) return;
      e.preventDefault();
      toggle();
    }
  });

  reduceMotion.addEventListener(&#39;change&#39;, function (e) {
    if (e.matches) {
      playing = false;
      sync();
    }
  });

  sync();
})();
&lt;/script&gt;
