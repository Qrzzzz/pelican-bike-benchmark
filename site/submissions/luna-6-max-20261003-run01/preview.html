  &lt;style&gt;
    :root {
      color-scheme: light;
      --ink: #203a3d;

      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: #dfe8dc;
      color: var(--ink);
    }
    .stage {
      position: relative;
      isolation: isolate;
      width: min(100vw, calc((100svh - 32px) * 1.5), 1440px);
      aspect-ratio: 3 / 2;
      overflow: hidden;
      border: 1px solid rgba(37, 68, 68, .13);
      border-radius: 26px;
      background: #d9ebdf;
      box-shadow: 0 24px 70px rgba(38, 69, 63, .12);

    .scene { display: block; width: 100%; height: 100%; }
    .caption {
      position: absolute;
      z-index: 2;
      top: clamp(24px, 5.2%, 54px);
      left: clamp(24px, 5.2%, 64px);
      max-width: 420px;
      pointer-events: none;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: #476665;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .16em;

    .eyebrow::before { content: &quot;&quot;; width: 22px; height: 2px; border-radius: 2px; background: var(--coral); }

      line-height: 1.15;

    .dek { margin: 12px 0 0; color: #43605f; font-size: clamp(13px, 1.35vw, 16px); letter-spacing: .045em; }
    .control-wrap {
      position: absolute;
      z-index: 3;
      right: clamp(18px, 3.5%, 42px);
      bottom: clamp(18px, 3.5%, 36px);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .toggle {

      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 18px;
      border: 1px solid rgba(32, 58, 61, .16);
      border-radius: 999px;
      background: #fff9ec;
      color: #203a3d;
      box-shadow: 0 5px 18px rgba(22, 44, 44, .16);
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .toggle:hover { transform: translateY(-2px); background: #fffdf7; box-shadow: 0 8px 22px rgba(22, 44, 44, .2); }
    .toggle:active { transform: translateY(0) scale(.98); }
    .toggle:focus-visible { outline: 3px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 6px #265859, 0 8px 22px rgba(22,44,44,.22); }
    .toggle svg { width: 17px; height: 17px; flex: none; }
    .pause-glyph { display: none; }
    .toggle[aria-pressed=&quot;true&quot;] .play-glyph { display: none; }
    .toggle[aria-pressed=&quot;true&quot;] .pause-glyph { display: block; }
    .motion-paused .animated { animation-play-state: paused !important; }
    .animated { animation-play-state: running; }
    .cloud { animation: cloud-drift 19s ease-in-out infinite alternate; }
    .cloud.cloud-two { animation-duration: 24s; animation-delay: -7s; }
    .cloud.cloud-three { animation-duration: 27s; animation-delay: -13s; }
    .sun-rays { transform-box: fill-box; transform-origin: center; animation: slow-turn 42s linear infinite; }
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: wheel-turn 1.35s linear infinite; }
    .pedal-turn { transform-box: fill-box; transform-origin: center; animation: wheel-turn 1.15s linear infinite; }
    .road-dashes { animation: road-flow 1.25s linear infinite; }
    .bird-bob { animation: bird-bob 2.3s ease-in-out infinite; }
    .coat-flutter { transform-box: fill-box; transform-origin: 10% 50%; animation: feather-flick 1.8s ease-in-out infinite alternate; }

    @keyframes road-flow { to { stroke-dashoffset: -116; } }
    @keyframes cloud-drift { from { transform: translateX(-9px); } to { transform: translateX(24px); } }
    @keyframes slow-turn { to { transform: rotate(360deg); } }
    @keyframes bird-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes feather-flick { from { transform: rotate(-1deg); } to { transform: rotate(2deg); } }

    @media (max-width: 680px) {

    @media (max-width: 360px) {

    &lt;div class=&quot;control-wrap&quot;&gt;
      &lt;span class=&quot;motion-status&quot; id=&quot;motion-status&quot; aria-live=&quot;polite&quot;&gt;&lt;/span&gt;
      &lt;button id=&quot;motion-toggle&quot; class=&quot;toggle&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot; aria-label=&quot;暂停动画&quot;&gt;
        &lt;svg viewBox=&quot;0 0 20 20&quot; aria-hidden=&quot;true&quot; focusable=&quot;false&quot;&gt;
          &lt;path class=&quot;play-glyph&quot; d=&quot;M6 3.8c0-.8.9-1.3 1.6-.8l8 5.6a1.7 1.7 0 0 1 0 2.8l-8 5.6c-.7.5-1.6 0-1.6-.8z&quot; fill=&quot;currentColor&quot;/&gt;
          &lt;path class=&quot;pause-glyph&quot; d=&quot;M5 4.3c0-.7.5-1.2 1.2-1.2h1.3c.7 0 1.2.5 1.2 1.2v11.4c0 .7-.5 1.2-1.2 1.2H6.2c-.7 0-1.2-.5-1.2-1.2zm6.3 0c0-.7.5-1.2 1.2-1.2h1.3c.7 0 1.2.5 1.2 1.2v11.4c0 .7-.5 1.2-1.2 1.2h-1.3c-.7 0-1.2-.5-1.2-1.2z&quot; fill=&quot;currentColor&quot;/&gt;
        &lt;/svg&gt;
        &lt;span id=&quot;motion-label&quot;&gt;暂停动画&lt;/span&gt;
      &lt;/button&gt;

  &lt;/main&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.documentElement;
      const button = document.getElementById(&#39;motion-toggle&#39;);
      const label = document.getElementById(&#39;motion-label&#39;);
      const status = document.getElementById(&#39;motion-status&#39;);
      const scene = document.getElementById(&#39;scene&#39;);
      const rider = document.getElementById(&#39;rider-composition&#39;);
      const reduceMotion = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
      let playing = !reduceMotion.matches;
      let userHasChosen = false;
      let spaceOnButton = false;

      function renderState() {
        root.classList.toggle(&#39;motion-paused&#39;, !playing);
        button.setAttribute(&#39;aria-pressed&#39;, String(playing));
        button.setAttribute(&#39;aria-label&#39;, playing ? &#39;暂停动画&#39; : &#39;播放动画&#39;);
        label.textContent = playing ? &#39;暂停动画&#39; : &#39;播放动画&#39;;
        status.textContent = playing ? &#39;动画播放中&#39; : &#39;动画已暂停&#39;;
        if (playing) scene.unpauseAnimations();
        else scene.pauseAnimations();
      }
      function setPlaying(value, userAction = false) {
        playing = value;
        if (userAction) userHasChosen = true;
        renderState();
      }
      button.addEventListener(&#39;click&#39;, () =&gt; setPlaying(!playing, true));
      document.addEventListener(&#39;keydown&#39;, event =&gt; {
        if (event.code !== &#39;Space&#39; || event.repeat) return;
        const target = event.target;
        if (target instanceof HTMLElement &amp;&amp; (target.isContentEditable || target.closest(&#39;input, textarea, select, [role=&quot;textbox&quot;]&#39;))) return;
        event.preventDefault();
        if (target === button || button.contains(target)) spaceOnButton = true;
        else setPlaying(!playing, true);
      });
      document.addEventListener(&#39;keyup&#39;, event =&gt; {
        if (event.code !== &#39;Space&#39;) return;
        event.preventDefault();
        if (spaceOnButton) {
          spaceOnButton = false;
          setPlaying(!playing, true);
        }
      });
      reduceMotion.addEventListener(&#39;change&#39;, event =&gt; {
        if (!userHasChosen) setPlaying(!event.matches);
      });

      function fitScene() {
        if (window.matchMedia(&#39;(max-width: 680px)&#39;).matches) {
          scene.setAttribute(&#39;viewBox&#39;, &#39;310 0 580 850&#39;);
          rider.setAttribute(&#39;transform&#39;, &#39;translate(600 425) scale(.9) translate(-600 -425)&#39;);
          scene.setAttribute(&#39;preserveAspectRatio&#39;, &#39;xMidYMid meet&#39;);
        } else {
          scene.setAttribute(&#39;viewBox&#39;, &#39;0 0 1200 800&#39;);
          scene.setAttribute(&#39;preserveAspectRatio&#39;, &#39;xMidYMid slice&#39;);
          rider.removeAttribute(&#39;transform&#39;);
        }
      }
      fitScene();
      window.addEventListener(&#39;resize&#39;, fitScene, { passive: true });
      renderState();
    })();
  &lt;/script&gt;
