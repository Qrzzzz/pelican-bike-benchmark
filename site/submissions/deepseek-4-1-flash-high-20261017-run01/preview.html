&lt;style&gt;
  :root {
    color-scheme: light;
    --ink: #20363e;
    --paper: #fff5e4;
    --paper-strong: #fffaf0;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: #245763;
    font-family: ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 72% 26%, rgba(255, 226, 166, .4), transparent 36%),
      linear-gradient(180deg, #3f8198 0%, #86b9bc 38%, #e9cdb1 66%, #f0a87f 100%);
  }

  .scene {
    display: block;
    width: 100%;
    height: 100%;
  }

  .toggle {
    position: fixed;
    left: 50%;
    bottom: max(22px, env(safe-area-inset-bottom));
    z-index: 10;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-height: 50px;
    padding: 0 22px 0 18px;
    border: 1.5px solid rgba(30, 52, 60, .38);
    border-radius: 999px;
    background: rgba(255, 248, 232, .93);
    color: var(--ink);
    box-shadow:
      0 14px 34px rgba(12, 38, 46, .26),
      0 2px 0 rgba(255, 255, 255, .7) inset;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: .015em;
    cursor: pointer;
    transform: translateX(-50%);
    transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
  }

  .toggle:hover {
    background: var(--paper-strong);
    box-shadow:
      0 18px 38px rgba(12, 38, 46, .29),
      0 2px 0 rgba(255, 255, 255, .8) inset;
    transform: translateX(-50%) translateY(-2px);
  }

  .toggle:active {
    transform: translateX(-50%) translateY(0) scale(.98);
  }

  .toggle:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 4px;
    box-shadow:
      0 0 0 7px rgba(255, 248, 232, .75),
      0 14px 34px rgba(12, 38, 46, .26);
  }

  .toggle-icon {
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
    fill: currentColor;
  }

  .icon-play { display: inline; }
  .icon-pause { display: none; }
  #app:not(.is-paused) .icon-play { display: none; }
  #app:not(.is-paused) .icon-pause { display: inline; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .wheel {
    transform-box: fill-box;
    transform-origin: center;
    animation: spin 1.7s linear infinite;
  }

  .bob {
    animation: bob 2.8s ease-in-out infinite;
  }

  .scarf {
    transform-box: fill-box;
    transform-origin: 84% 42%;
    animation: scarf-flutter 2.4s ease-in-out infinite;
  }

  .cloud-a { animation: cloud-drift 19s ease-in-out infinite alternate; }
  .cloud-b { animation: cloud-drift 27s ease-in-out infinite alternate-reverse; }
  .cloud-c { animation: cloud-drift 23s ease-in-out infinite alternate; }

  .birds { animation: birds-drift 13s ease-in-out infinite alternate; }

  .glints { animation: shimmer 4.6s ease-in-out infinite; }

  .lane-dashes {
    animation: lane-flow 1.15s linear infinite;
  }

  .dust circle {
    transform-box: fill-box;
    transform-origin: center;
    animation: dust-puff 2.5s ease-out infinite;
  }

  .dust circle:nth-child(2) { animation-delay: .55s; }
  .dust circle:nth-child(3) { animation-delay: 1.1s; }
  .dust circle:nth-child(4) { animation-delay: 1.65s; }
  .dust circle:nth-child(5) { animation-delay: 2.05s; }

  .speed-line {
    animation: speed-line 2.2s ease-in-out infinite;
  }
  .speed-line:nth-child(2) { animation-delay: .45s; }
  .speed-line:nth-child(3) { animation-delay: .9s; }

  .grass {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: grass-sway 3.6s ease-in-out infinite alternate;
  }
  .grass-b { animation-delay: -1.8s; }

  #app.is-paused .scene * {
    animation-play-state: paused !important;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  @keyframes scarf-flutter {
    0%, 100% { transform: rotate(-1.4deg) translateY(0); }
    50% { transform: rotate(2.1deg) translateY(-1.5px); }
  }

  @keyframes cloud-drift {
    from { transform: translateX(-12px); }
    to { transform: translateX(22px); }
  }

  @keyframes birds-drift {
    from { transform: translate(-8px, 3px); }
    to { transform: translate(14px, -5px); }
  }

  @keyframes shimmer {
    0%, 100% { opacity: .55; }
    50% { opacity: .95; }
  }

  @keyframes lane-flow {
    to { stroke-dashoffset: 88; }
  }

  @keyframes dust-puff {
    0% { opacity: 0; transform: translate(0, 0) scale(.35); }
    18% { opacity: .38; }
    100% { opacity: 0; transform: translate(-78px, -27px) scale(1.3); }
  }

  @keyframes speed-line {
    0% { opacity: 0; transform: translateX(22px); }
    40% { opacity: .45; }
    100% { opacity: 0; transform: translateX(-34px); }
  }

  @keyframes grass-sway {
    from { transform: rotate(-1.2deg); }
    to { transform: rotate(1.8deg); }
  }

  @media (max-width: 560px) {
    .toggle {
      min-height: 48px;
      padding: 0 19px 0 16px;
      font-size: .95rem;
    }
    .toggle-icon {
      width: 18px;
      height: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .toggle { transition: none; }
  }

            &lt;path d=&quot;M 669 307 C 646 294 620 294 598 306 C 624 310 646 320 664 334 C 663 324 665 315 669 307 Z&quot; fill=&quot;#d94d3f&quot; stroke=&quot;#213940&quot; stroke-width=&quot;3.5&quot; stroke-linejoin=&quot;round&quot;/&gt;
            &lt;path d=&quot;M 666 317 C 642 316 621 324 603 342 C 631 334 655 334 677 329 C 671 326 668 322 666 317 Z&quot; fill=&quot;#b83d34&quot; stroke=&quot;#213940&quot; stroke-width=&quot;3.5&quot; stroke-linejoin=&quot;round&quot;/&gt;
            &lt;circle cx=&quot;688&quot; cy=&quot;312&quot; r=&quot;7.5&quot; fill=&quot;#e85b4b&quot; stroke=&quot;#213940&quot; stroke-width=&quot;3&quot;/&gt;
          &lt;/g&gt;
        &lt;/g&gt;
      &lt;/g&gt;
      &lt;g id=&quot;near-pedal&quot; transform=&quot;translate(574 543)&quot;&gt;
        &lt;rect x=&quot;-19&quot; y=&quot;-5.5&quot; width=&quot;38&quot; height=&quot;11&quot; rx=&quot;5.5&quot; fill=&quot;#f3dfb4&quot; stroke=&quot;#1d343c&quot; stroke-width=&quot;3&quot;/&gt;
        &lt;path d=&quot;M -12 0 L 12 0&quot; stroke=&quot;#1d343c&quot; stroke-width=&quot;1.7&quot; opacity=&quot;.5&quot;/&gt;
      &lt;/g&gt;
      &lt;g id=&quot;near-foot&quot; transform=&quot;translate(574 543)&quot;&gt;
        &lt;path d=&quot;M -9 -4 C -3 -13 11 -14 21 -8 C 29 -4 37 -1 38 3 C 27 3 24 7 16 7 C 8 8 -1 5 -6 3 Z&quot; fill=&quot;#ef914a&quot; stroke=&quot;#1d343c&quot; stroke-width=&quot;3.2&quot; stroke-linejoin=&quot;round&quot;/&gt;
        &lt;path d=&quot;M 6 -4 L 29 -3 M 5 1 L 22 2&quot; fill=&quot;none&quot; stroke=&quot;#b4612c&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;
      &lt;/g&gt;
    &lt;/g&gt;
  &lt;/svg&gt;

  &lt;button id=&quot;toggle&quot; class=&quot;toggle&quot; type=&quot;button&quot; aria-label=&quot;Play animation (Space)&quot; title=&quot;Play or pause (Space)&quot;&gt;
    &lt;svg class=&quot;toggle-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot; focusable=&quot;false&quot;&gt;
      &lt;path class=&quot;icon-play&quot; d=&quot;M 8 5.2 C 8 4.5 8.8 4.1 9.4 4.5 L 18.7 11.3 C 19.2 11.7 19.2 12.3 18.7 12.7 L 9.4 19.5 C 8.8 19.9 8 19.5 8 18.8 Z&quot;/&gt;
      &lt;path class=&quot;icon-pause&quot; d=&quot;M 7 5 H 10 V 19 H 7 Z M 14 5 H 17 V 19 H 14 Z&quot;/&gt;
    &lt;/svg&gt;
    &lt;span id=&quot;toggle-label&quot;&gt;Play&lt;/span&gt;
  &lt;/button&gt;
  &lt;p id=&quot;status&quot; class=&quot;sr-only&quot; aria-live=&quot;polite&quot;&gt;Animation paused&lt;/p&gt;
&lt;/main&gt;

&lt;script&gt;
(function () {
  &quot;use strict&quot;;

  var app = document.getElementById(&quot;app&quot;);
  var toggle = document.getElementById(&quot;toggle&quot;);
  var toggleLabel = document.getElementById(&quot;toggle-label&quot;);
  var status = document.getElementById(&quot;status&quot;);
  var rider = document.getElementById(&quot;rider&quot;);
  var reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);

  var playing = false;
  var rafId = null;
  var lastTime = 0;
  var crankAngle = 0.62;

  var BB = { x: 590, y: 565 };
  var CRANK_RADIUS = 44;
  var NEAR_HIP = { x: 574, y: 420 };
  var FAR_HIP = { x: 557, y: 418 };
  var NEAR_LEG = { l1: 98, l2: 104 };
  var FAR_LEG = { l1: 96, l2: 102 };

  var el = {
    nearCrankOutline: document.getElementById(&quot;near-crank-outline&quot;),
    nearCrank: document.getElementById(&quot;near-crank&quot;),
    farCrankOutline: document.getElementById(&quot;far-crank-outline&quot;),
    farCrank: document.getElementById(&quot;far-crank&quot;),
    nearThighOutline: document.getElementById(&quot;near-thigh-outline&quot;),
    nearThigh: document.getElementById(&quot;near-thigh&quot;),
    nearShinOutline: document.getElementById(&quot;near-shin-outline&quot;),
    nearShin: document.getElementById(&quot;near-shin&quot;),
    farThighOutline: document.getElementById(&quot;far-thigh-outline&quot;),
    farThigh: document.getElementById(&quot;far-thigh&quot;),
    farShinOutline: document.getElementById(&quot;far-shin-outline&quot;),
    farShin: document.getElementById(&quot;far-shin&quot;),
    nearPedal: document.getElementById(&quot;near-pedal&quot;),
    nearFoot: document.getElementById(&quot;near-foot&quot;),
    nearKnee: document.getElementById(&quot;near-knee&quot;),
    farPedal: document.getElementById(&quot;far-pedal&quot;),
    farFoot: document.getElementById(&quot;far-foot&quot;),
    farKnee: document.getElementById(&quot;far-knee&quot;),
    chainring: document.getElementById(&quot;chainring&quot;)
  };

  function polarPoint(angle, sign) {
    return {
      x: BB.x + Math.cos(angle) * CRANK_RADIUS * sign,
      y: BB.y + Math.sin(angle) * CRANK_RADIUS * sign
    };
  }

  function solveKnee(hip, ankle, l1, l2) {
    var dx = ankle.x - hip.x;
    var dy = ankle.y - hip.y;
    var rawDistance = Math.hypot(dx, dy) || 0.0001;
    var unitX = dx / rawDistance;
    var unitY = dy / rawDistance;
    var distance = Math.min(l1 + l2 - 0.01, Math.max(Math.abs(l1 - l2) + 0.01, rawDistance));
    var end = {
      x: hip.x + unitX * distance,
      y: hip.y + unitY * distance
    };
    var baseAngle = Math.atan2(unitY, unitX);
    var cosine = (l1 * l1 + distance * distance - l2 * l2) / (2 * l1 * distance);
    var bend = Math.acos(Math.max(-1, Math.min(1, cosine)));
    var kneeAngle = baseAngle - bend;

    return {
      end: end,
      knee: {
        x: hip.x + Math.cos(kneeAngle) * l1,
        y: hip.y + Math.sin(kneeAngle) * l1
      }
    };
  }

  function movePath(node, from, to) {
    node.setAttribute(&quot;d&quot;, &quot;M &quot; + from.x.toFixed(2) + &quot; &quot; + from.y.toFixed(2) + &quot; L &quot; + to.x.toFixed(2) + &quot; &quot; + to.y.toFixed(2));
  }

  function updateLeg(hip, pedal, lengths, ids) {
    var ankle = { x: pedal.x, y: pedal.y - 7 };
    var solved = solveKnee(hip, ankle, lengths.l1, lengths.l2);
    var lowerEnd = solved.end;
    var knee = solved.knee;

    movePath(ids.thighOutline, hip, knee);
    movePath(ids.thigh, hip, knee);
    movePath(ids.shinOutline, knee, lowerEnd);
    movePath(ids.shin, knee, lowerEnd);
    ids.knee.setAttribute(&quot;cx&quot;, knee.x.toFixed(2));
    ids.knee.setAttribute(&quot;cy&quot;, knee.y.toFixed(2));
  }

  function updateCrank(pedal, outline, arm) {
    movePath(outline, BB, pedal);
    movePath(arm, BB, pedal);
  }

  function updatePedal(pedalNode, footNode, pedal) {
    var transform = &quot;translate(&quot; + pedal.x.toFixed(2) + &quot; &quot; + pedal.y.toFixed(2) + &quot;)&quot;;
    pedalNode.setAttribute(&quot;transform&quot;, transform);
    footNode.setAttribute(&quot;transform&quot;, transform);
  }

  function renderRig(angle) {
    var nearPedal = polarPoint(angle, 1);
    var farPedal = polarPoint(angle, -1);

    updateCrank(nearPedal, el.nearCrankOutline, el.nearCrank);
    updateCrank(farPedal, el.farCrankOutline, el.farCrank);

    updatePedal(el.nearPedal, el.nearFoot, nearPedal);
    updatePedal(el.farPedal, el.farFoot, farPedal);

    updateLeg(NEAR_HIP, nearPedal, NEAR_LEG, {
      thighOutline: el.nearThighOutline,
      thigh: el.nearThigh,
      shinOutline: el.nearShinOutline,
      shin: el.nearShin,
      knee: el.nearKnee
    });

    updateLeg(FAR_HIP, farPedal, FAR_LEG, {
      thighOutline: el.farThighOutline,
      thigh: el.farThigh,
      shinOutline: el.farShinOutline,
      shin: el.farShin,
      knee: el.farKnee
    });

    var ringDegrees = angle * 180 / Math.PI;
    el.chainring.setAttribute(&quot;transform&quot;, &quot;rotate(&quot; + ringDegrees.toFixed(2) + &quot; 590 565)&quot;);
  }

  function step(now) {
    var delta = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    crankAngle = (crankAngle + delta * 1.52) % (Math.PI * 2);
    renderRig(crankAngle);
    rafId = window.requestAnimationFrame(step);
  }

  function setPlaying(next, announce) {
    playing = next;
    app.classList.toggle(&quot;is-paused&quot;, !playing);
    toggleLabel.textContent = playing ? &quot;Pause&quot; : &quot;Play&quot;;
    toggle.setAttribute(&quot;aria-label&quot;, (playing ? &quot;Pause&quot; : &quot;Play&quot;) + &quot; animation (Space)&quot;);
    toggle.setAttribute(&quot;title&quot;, (playing ? &quot;Pause&quot; : &quot;Play&quot;) + &quot; animation (Space)&quot;);

    if (playing) {
      if (rafId === null) {
        lastTime = window.performance.now();
        rafId = window.requestAnimationFrame(step);
      }
    } else if (rafId !== null) {
      window.cancelAnimationFrame(rafId);
      rafId = null;
    }

    if (announce) {
      status.textContent = playing ? &quot;Animation playing&quot; : &quot;Animation paused&quot;;
    }
  }

  function layoutRider() {
    var width = window.innerWidth;
    var height = window.innerHeight;

    if (!width || !height) {
      return;
    }

    var sliceScale = Math.max(width / 1200, height / 800);
    var visibleWidth = width / sliceScale;
    var visibleHeight = height / sliceScale;
    var visibleTop = 800 - visibleHeight;
    var riderLeft = 355;
    var riderRight = 925;
    var riderTop = 185;
    var riderGround = 665;
    var riderWidth = riderRight - riderLeft;
    var riderHeight = riderGround - riderTop;

    var scale = Math.min(
      1,
      (visibleWidth * 0.88) / riderWidth,
      (riderGround - visibleTop - 14) / riderHeight
    );

    if (scale &gt; 0.999) {
      rider.removeAttribute(&quot;transform&quot;);
      return;
    }

    var riderCenter = (riderLeft + riderRight) / 2;
    var translateX = 600 - riderCenter * scale;
    var translateY = riderGround - riderGround * scale;

    rider.setAttribute(
      &quot;transform&quot;,
      &quot;translate(&quot; + translateX.toFixed(2) + &quot; &quot; + translateY.toFixed(2) + &quot;) scale(&quot; + scale.toFixed(4) + &quot;)&quot;
    );
  }

  toggle.addEventListener(&quot;click&quot;, function () {
    setPlaying(!playing, true);
  });

  window.addEventListener(&quot;keydown&quot;, function (event) {
    var isSpace = event.code === &quot;Space&quot; || event.key === &quot; &quot;;
    if (!isSpace) {
      return;
    }

    var target = event.target;
    if (target &amp;&amp; target.closest &amp;&amp; target.closest(&quot;input, textarea, select, [contenteditable=&#39;true&#39;]&quot;)) {
      return;
    }

    event.preventDefault();
    if (!event.repeat) {
      setPlaying(!playing, true);
    }
  }, { passive: false });

  if (typeof reducedMotion.addEventListener === &quot;function&quot;) {
    reducedMotion.addEventListener(&quot;change&quot;, function (event) {
      if (event.matches) {
        setPlaying(false, true);
      }
    });
  }

  window.addEventListener(&quot;resize&quot;, layoutRider, { passive: true });
  window.addEventListener(&quot;orientationchange&quot;, layoutRider, { passive: true });

  renderRig(crankAngle);
  layoutRider();
  setPlaying(!reducedMotion.matches, false);
})();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
