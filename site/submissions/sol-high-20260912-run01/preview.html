  &lt;style&gt;
    :root {
      color-scheme: light;
      --ink: #122d35;
      --cream: #fff8e8;
      --sun: #f8c85c;
      --coral: #ec704c;
      --teal: #0d6070;
      --road: #173b42;
      --outline: #132f36;
      font-family: ui-rounded, &quot;Arial Rounded MT Bold&quot;, &quot;Trebuchet MS&quot;, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: stretch;
      background: #8ed8dd;
      color: var(--ink);
    }

    button { font: inherit; }

    .scene {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      isolation: isolate;
      background: #8ed8dd;
    }

    .scene::after {
      content: &quot;&quot;;
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.16), transparent 24%),
        radial-gradient(circle at 50% 45%, transparent 42%, rgba(8,50,57,.14) 118%);
      mix-blend-mode: multiply;
    }

    .art {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 520px;
    }

    .eyebrow {
      position: absolute;
      z-index: 7;
      top: max(1rem, env(safe-area-inset-top));
      left: max(1rem, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      gap: .65rem;
      margin: 0;
      padding: .55rem .78rem;
      border: 2px solid rgba(18,45,53,.83);
      border-radius: 999px;
      background: rgba(255,248,232,.82);
      box-shadow: 4px 4px 0 rgba(18,45,53,.18);
      font-family: ui-monospace, &quot;Cascadia Mono&quot;, Consolas, monospace;
      font-size: clamp(.76rem, 1.1vw, .9rem);
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .eyebrow::before {
      content: &quot;&quot;;
      width: .58rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 0 3px rgba(236,112,76,.2);
    }

    .controls {
      position: absolute;
      z-index: 8;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
    }

    .toggle {
      min-width: 9.5rem;
      min-height: 3.35rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .72rem;
      padding: .7rem 1.1rem;
      border: 2px solid var(--outline);
      border-radius: 999px;
      color: var(--cream);
      background: var(--teal);
      box-shadow: 5px 5px 0 rgba(18,45,53,.25);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .02em;
      transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .toggle:hover { background: #084d5a; }
    .toggle:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 rgba(18,45,53,.28); }
    .toggle:focus-visible { outline: 4px solid #fff5bd; outline-offset: 4px; }

    .toggle__icon {
      width: 1.1rem;
      height: 1.1rem;
      position: relative;
      flex: 0 0 auto;
    }

    .toggle__icon::before,
    .toggle__icon::after {
      content: &quot;&quot;;
      position: absolute;
    }

    body[data-playing=&quot;true&quot;] .toggle__icon::before,
    body[data-playing=&quot;true&quot;] .toggle__icon::after {
      top: 0;
      bottom: 0;
      width: .34rem;
      border-radius: 2px;
      background: currentColor;
    }

    body[data-playing=&quot;true&quot;] .toggle__icon::before { left: .1rem; }
    body[data-playing=&quot;true&quot;] .toggle__icon::after { right: .1rem; }

    body:not([data-playing=&quot;true&quot;]) .toggle__icon::before {
      inset: 0;
      width: 0;
      height: 0;
      margin: auto;
      border-top: .56rem solid transparent;
      border-bottom: .56rem solid transparent;
      border-left: .86rem solid currentColor;
      transform: translateX(.08rem);
    }

    .anim { animation-play-state: paused !important; }
    body[data-playing=&quot;true&quot;] .anim { animation-play-state: running !important; }

    .cloud-a { animation: cloudDriftA 16s linear infinite; }
    .cloud-b { animation: cloudDriftB 21s linear infinite; }
    .far-hills { animation: farDrift 18s linear infinite; }
    .near-hills { animation: nearDrift 9s linear infinite; }
    .road-lines { animation: roadRush .85s linear infinite; }
    .dust { animation: dustTrail 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }

    .rider-bob {
      animation: riderBob .58s ease-in-out infinite alternate;
      transform-box: view-box;
      transform-origin: 570px 405px;
    }

    .tail-feathers {
      animation: featherFlutter .44s ease-in-out infinite alternate;
      transform-box: view-box;
      transform-origin: 407px 350px;
    }

    .wing {
      animation: wingBreathe 1.15s ease-in-out infinite alternate;
      transform-box: view-box;
      transform-origin: 520px 347px;
    }

    .neck-scarf {
      animation: scarfWave .72s ease-in-out infinite alternate;
      transform-box: view-box;
      transform-origin: 634px 306px;
    }

    .wheel-rear,
    .wheel-front,
    .crank {
      animation: spin .82s linear infinite;
      transform-box: view-box;
    }

    .wheel-rear { transform-origin: 360px 604px; }
    .wheel-front { transform-origin: 835px 604px; }
    .crank { transform-origin: 565px 590px; }

    .leg-back {
      animation: legBack .82s ease-in-out infinite alternate;
      transform-box: view-box;
      transform-origin: 532px 407px;
    }

    .leg-front {
      animation: legFront .82s ease-in-out infinite alternate;
      transform-box: view-box;
      transform-origin: 590px 409px;
    }

    .speed-mark { animation: speedPulse 1.25s ease-in-out infinite; }
    .speed-mark:nth-child(2) { animation-delay: -.42s; }
    .speed-mark:nth-child(3) { animation-delay: -.84s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes roadRush { to { stroke-dashoffset: 180; } }
    @keyframes cloudDriftA { from { transform: translateX(0); } to { transform: translateX(-420px); } }
    @keyframes cloudDriftB { from { transform: translateX(0); } to { transform: translateX(-520px); } }
    @keyframes farDrift { from { transform: translateX(0); } to { transform: translateX(-150px); } }
    @keyframes nearDrift { from { transform: translateX(0); } to { transform: translateX(-240px); } }
    @keyframes riderBob { to { transform: translateY(-5px) rotate(.35deg); } }
    @keyframes wingBreathe { to { transform: rotate(-4deg) translateY(-2px); } }
    @keyframes featherFlutter { to { transform: rotate(5deg); } }
    @keyframes scarfWave { to { transform: rotate(8deg) skewX(-5deg); } }
    @keyframes legBack { to { transform: rotate(5deg) translateY(2px); } }
    @keyframes legFront { to { transform: rotate(-5deg) translateY(-2px); } }
    @keyframes dustTrail {
      0% { opacity: 0; transform: translate(0,0) scale(.55); }
      25% { opacity: .55; }
      100% { opacity: 0; transform: translate(-75px,-18px) scale(1.4); }
    }
    @keyframes speedPulse {
      0%, 100% { opacity: .15; transform: translateX(24px); }
      48% { opacity: .7; transform: translateX(0); }
    }

    @media (max-width: 600px) {
      .scene { min-height: 100svh; }
      .art { min-height: 100svh; }
      .subject {
        transform: translateY(72px) scale(.5);
        transform-box: view-box;
        transform-origin: 600px 500px;
      }
      .eyebrow { max-width: calc(100vw - 2rem); letter-spacing: .08em; }
      .controls { left: max(1rem, env(safe-area-inset-left)); right: max(1rem, env(safe-area-inset-right)); }
      .toggle { width: 100%; min-height: 3.55rem; }
    }

    @media (prefers-contrast: more) {
      .toggle, .eyebrow { border-width: 3px; }
      .scene::after { display: none; }
    }

    &lt;div class=&quot;controls&quot;&gt;
      &lt;button class=&quot;toggle&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot; aria-label=&quot;暂停动画&quot;&gt;
        &lt;span class=&quot;toggle__icon&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
        &lt;span class=&quot;toggle__text&quot;&gt;暂停动画&lt;/span&gt;
      &lt;/button&gt;
    &lt;/div&gt;
  &lt;/main&gt;

  &lt;script&gt;
    (() =&gt; {
      const button = document.querySelector(&#39;.toggle&#39;);
      const label = button.querySelector(&#39;.toggle__text&#39;);
      const reducedMotion = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
      let playing = !reducedMotion.matches;

      const render = () =&gt; {
        document.body.dataset.playing = String(playing);
        button.setAttribute(&#39;aria-pressed&#39;, String(playing));
        button.setAttribute(&#39;aria-label&#39;, playing ? &#39;暂停动画&#39; : &#39;播放动画&#39;);
        label.textContent = playing ? &#39;暂停动画&#39; : &#39;播放动画&#39;;
      };

      const toggle = () =&gt; {
        playing = !playing;
        render();
      };

      button.addEventListener(&#39;click&#39;, toggle);

      document.addEventListener(&#39;keydown&#39;, (event) =&gt; {
        if (event.code !== &#39;Space&#39; || event.repeat) return;
        const target = event.target;
        if (target instanceof HTMLElement &amp;&amp; target.matches(&#39;input, textarea, select, [contenteditable=&quot;true&quot;]&#39;)) return;
        event.preventDefault();
        toggle();
      });

      const onMotionPreferenceChange = (event) =&gt; {
        if (event.matches) {
          playing = false;
          render();
        }
      };

      if (typeof reducedMotion.addEventListener === &#39;function&#39;) {
        reducedMotion.addEventListener(&#39;change&#39;, onMotionPreferenceChange);
      } else if (typeof reducedMotion.addListener === &#39;function&#39;) {
        reducedMotion.addListener(onMotionPreferenceChange);
      }

      render();
    })();
  &lt;/script&gt;
