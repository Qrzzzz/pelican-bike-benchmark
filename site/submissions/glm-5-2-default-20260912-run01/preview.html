&lt;title&gt;Pelican on a Bicycle&lt;/title&gt;
&lt;style&gt;
  :root{
    --ink:#1f2430;
    --accent:#e0524a;
    --good:#36b3a8;
    --panel:rgba(31,36,48,.82);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:#bfe3ff;
    overflow:hidden;
    font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .stage{
    position:fixed;
    inset:0;
    display:block;
  }
  svg.scene{
    display:block;
    width:100%;
    height:100%;
  }

  /* animation engine */
  .fx{animation-iteration-count:infinite;animation-timing-function:linear;}
  body.is-paused .fx{animation-play-state:paused;}

  .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite;}
  .crank{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite;}
  .rig{transform-box:fill-box;transform-origin:center;animation:bob 1.7s ease-in-out infinite;}
  .wing{transform-box:fill-box;transform-origin:28% 22%;animation:flap .85s ease-in-out infinite;}
  .scarf{transform-box:fill-box;transform-origin:100% 50%;animation:wave 1.1s ease-in-out infinite;}
  .clouds{transform-box:fill-box;transform-origin:center;animation:drift 34s linear infinite;}
  .mid{transform-box:fill-box;transform-origin:center;animation:midmove 6s linear infinite;}
  .grass{transform-box:fill-box;transform-origin:center;animation:fgmove 2.4s linear infinite;}
  .dash{stroke-dasharray:60 60;animation:road .5s linear infinite;}
  .streak{transform-box:fill-box;transform-origin:center;animation:streak .9s linear infinite;}
  .sun{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite;}

  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  @keyframes flap{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(12deg);}}
  @keyframes wave{0%,100%{transform:rotate(-5deg);}50%{transform:rotate(7deg);}}
  @keyframes drift{to{transform:translateX(-1200px);}}
  @keyframes midmove{to{transform:translateX(-1200px);}}
  @keyframes fgmove{to{transform:translateX(-1200px);}}
  @keyframes road{to{stroke-dashoffset:-120;}}
  @keyframes streak{0%{transform:translateX(0);opacity:0;}15%{opacity:.7;}100%{transform:translateX(-260px);opacity:0;}}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

  /* controls */
  .ui{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    z-index:5;
    display:flex;
    gap:10px;
    align-items:center;
  }
  .btn{
    appearance:none;
    border:0;
    cursor:pointer;
    padding:11px 20px 11px 16px;
    border-radius:999px;
    background:var(--panel);
    color:#fff;
    font:600 15px/1 system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif;
    letter-spacing:.2px;
    display:inline-flex;
    align-items:center;
    gap:9px;
    box-shadow:0 6px 18px rgba(0,0,0,.22);
    transition:transform .12s ease,background .2s ease;
  }
  .btn:hover{background:rgba(31,36,48,.95);}
  .btn:active{transform:translateX(-50%) scale(.97);}
  .btn:focus-visible{
    outline:3px solid #ffd86b;
    outline-offset:3px;
  }
  .btn .ico{width:14px;height:14px;display:block;}
  .badge{
    background:rgba(255,255,255,.92);
    color:var(--ink);
    font:600 12px/1 system-ui,sans-serif;
    padding:7px 11px;
    border-radius:999px;
    box-shadow:0 4px 12px rgba(0,0,0,.18);
    white-space:nowrap;
  }
  kbd{
    background:#fff;color:var(--ink);
    border-radius:5px;padding:2px 6px;
    font:600 11px/1 system-ui,sans-serif;
    box-shadow:0 1px 0 rgba(0,0,0,.25);
  }
  @media (max-width:560px){
    .ui{bottom:14px;}
    .btn{padding:10px 16px 10px 13px;font-size:14px;}
    .badge{display:none;}
  }

&lt;body&gt;
  &lt;div class=&quot;stage&quot;&gt;
    &lt;svg class=&quot;scene&quot; id=&quot;scene&quot; viewBox=&quot;0 0 1200 800&quot; preserveAspectRatio=&quot;xMidYMid slice&quot; role=&quot;img&quot;
         aria-label=&quot;一只鹈鹕骑着自行车在乡间小路上前进的插画&quot;&gt;
      &lt;title&gt;鹈鹕骑自行车&lt;/title&gt;
      &lt;desc&gt;一只戴着头盔和红围巾的鹈鹕骑红色自行车向前行驶，车轮和脚踏转动，云朵与树木向后移动。&lt;/desc&gt;

      &lt;defs&gt;

          &lt;stop offset=&quot;0&quot; stop-color=&quot;#fff3c4&quot;/&gt;
          &lt;stop offset=&quot;55%&quot; stop-color=&quot;#ffd86b&quot;/&gt;
          &lt;stop offset=&quot;100%&quot; stop-color=&quot;#ffd86b&quot; stop-opacity=&quot;0&quot;/&gt;
        &lt;/radialGradient&gt;
        &lt;linearGradient id=&quot;bodyG&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;
          &lt;stop offset=&quot;0&quot; stop-color=&quot;#ffffff&quot;/&gt;
          &lt;stop offset=&quot;100%&quot; stop-color=&quot;#dfe7f0&quot;/&gt;
        &lt;/linearGradient&gt;
        &lt;linearGradient id=&quot;beakG&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;1&quot; y2=&quot;0&quot;&gt;
          &lt;stop offset=&quot;0&quot; stop-color=&quot;#f3a64a&quot;/&gt;
          &lt;stop offset=&quot;100&quot; stop-color=&quot;#f0842a&quot;/&gt;
        &lt;/linearGradient&gt;
        &lt;linearGradient id=&quot;pouchG&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;

          &lt;stop offset=&quot;100%&quot; stop-color=&quot;#f7a93a&quot;/&gt;

          &lt;stop offset=&quot;100%&quot; stop-color=&quot;#c8392f&quot;/&gt;
        &lt;/linearGradient&gt;

        &lt;filter id=&quot;soft&quot; x=&quot;-30%&quot; y=&quot;-30%&quot; width=&quot;160%&quot; height=&quot;160%&quot;&gt;
          &lt;feGaussianBlur stdDeviation=&quot;4&quot;/&gt;

        &lt;!-- reusable scenery sets (span 0..1200) --&gt;

            &lt;ellipse cx=&quot;620&quot; cy=&quot;70&quot; rx=&quot;52&quot; ry=&quot;24&quot;/&gt;&lt;ellipse cx=&quot;670&quot; cy=&quot;58&quot; rx=&quot;44&quot; ry=&quot;26&quot;/&gt;&lt;ellipse cx=&quot;710&quot; cy=&quot;74&quot; rx=&quot;40&quot; ry=&quot;20&quot;/&gt;&lt;rect x=&quot;620&quot; y=&quot;72&quot; width=&quot;110&quot; height=&quot;22&quot; rx=&quot;11&quot;/&gt;
            &lt;ellipse cx=&quot;980&quot; cy=&quot;150&quot; rx=&quot;42&quot; ry=&quot;20&quot;/&gt;&lt;ellipse cx=&quot;1020&quot; cy=&quot;140&quot; rx=&quot;36&quot; ry=&quot;22&quot;/&gt;&lt;rect x=&quot;980&quot; y=&quot;150&quot; width=&quot;80&quot; height=&quot;18&quot; rx=&quot;9&quot;/&gt;
          &lt;/g&gt;
        &lt;/g&gt;

        &lt;g id=&quot;bushset&quot;&gt;
          &lt;!-- distant conifer &amp; bushes along horizon (base ~600) --&gt;
          &lt;g fill=&quot;#6fae6a&quot;&gt;
            &lt;path d=&quot;M210 600 L210 558 L188 600 Z&quot;/&gt;&lt;path d=&quot;M210 600 L210 540 L195 600 Z&quot;/&gt;&lt;path d=&quot;M210 600 L210 524 L202 600 Z&quot;/&gt;
            &lt;circle cx=&quot;120&quot; cy=&quot;588&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;148&quot; cy=&quot;580&quot; r=&quot;20&quot;/&gt;&lt;circle cx=&quot;300&quot; cy=&quot;592&quot; r=&quot;26&quot;/&gt;&lt;circle cx=&quot;332&quot; cy=&quot;584&quot; r=&quot;20&quot;/&gt;
            &lt;circle cx=&quot;470&quot; cy=&quot;590&quot; r=&quot;24&quot;/&gt;&lt;circle cx=&quot;500&quot; cy=&quot;582&quot; r=&quot;18&quot;/&gt;
            &lt;circle cx=&quot;660&quot; cy=&quot;592&quot; r=&quot;28&quot;/&gt;&lt;circle cx=&quot;696&quot; cy=&quot;584&quot; r=&quot;20&quot;/&gt;
            &lt;path d=&quot;M860 600 L860 556 L836 600 Z&quot;/&gt;&lt;path d=&quot;M860 600 L860 538 L848 600 Z&quot;/&gt;
            &lt;circle cx=&quot;980&quot; cy=&quot;590&quot; r=&quot;24&quot;/&gt;&lt;circle cx=&quot;1010&quot; cy=&quot;582&quot; r=&quot;18&quot;/&gt;
            &lt;circle cx=&quot;1130&quot; cy=&quot;588&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;1160&quot; cy=&quot;580&quot; r=&quot;18&quot;/&gt;
          &lt;/g&gt;
          &lt;g fill=&quot;#5e9d5c&quot; opacity=&quot;.9&quot;&gt;
            &lt;circle cx=&quot;220&quot; cy=&quot;600&quot; r=&quot;20&quot;/&gt;&lt;circle cx=&quot;400&quot; cy=&quot;600&quot; r=&quot;22&quot;/&gt;&lt;circle cx=&quot;610&quot; cy=&quot;600&quot; r=&quot;20&quot;/&gt;&lt;circle cx=&quot;800&quot; cy=&quot;600&quot; r=&quot;24&quot;/&gt;&lt;circle cx=&quot;1040&quot; cy=&quot;600&quot; r=&quot;20&quot;/&gt;
          &lt;/g&gt;
        &lt;/g&gt;

        &lt;g id=&quot;grassset&quot;&gt;
          &lt;g stroke=&quot;#3f8f3a&quot; stroke-width=&quot;4&quot; stroke-linecap=&quot;round&quot; fill=&quot;none&quot;&gt;
            &lt;path d=&quot;M40 660 q4 -22 8 0&quot;/&gt;&lt;path d=&quot;M52 662 q4 -26 8 0&quot;/&gt;
            &lt;path d=&quot;M250 658 q4 -24 8 0&quot;/&gt;&lt;path d=&quot;M262 662 q5 -28 9 0&quot;/&gt;

            &lt;path d=&quot;M940 660 q4 -24 8 0&quot;/&gt;&lt;path d=&quot;M1080 658 q4 -22 8 0&quot;/&gt;

        &lt;/g&gt;

        &lt;!-- one wheel template (drawn around 0,0) --&gt;
        &lt;g id=&quot;wheel&quot;&gt;
          &lt;circle r=&quot;82&quot; fill=&quot;#262b37&quot;/&gt;
          &lt;circle r=&quot;82&quot; fill=&quot;none&quot; stroke=&quot;#15191f&quot; stroke-width=&quot;6&quot;/&gt;
          &lt;circle r=&quot;71&quot; fill=&quot;none&quot; stroke=&quot;#c7cfd9&quot; stroke-width=&quot;4&quot;/&gt;
          &lt;g stroke=&quot;#aeb6c4&quot; stroke-width=&quot;2.2&quot;&gt;
            &lt;line x1=&quot;-70&quot; y1=&quot;0&quot; x2=&quot;70&quot; y2=&quot;0&quot;/&gt;

      &lt;/defs&gt;

      &lt;!-- 1. sky --&gt;
      &lt;rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;1200&quot; height=&quot;800&quot; fill=&quot;url(#sky)&quot;/&gt;

      &lt;!-- 3. clouds (slow) --&gt;

      &lt;!-- 4. distant hills --&gt;

        &lt;rect class=&quot;i-pause&quot; x=&quot;2&quot; y=&quot;1&quot; width=&quot;3.2&quot; height=&quot;12&quot; rx=&quot;1&quot; fill=&quot;#fff&quot;/&gt;
        &lt;rect class=&quot;i-pause&quot; x=&quot;8.8&quot; y=&quot;1&quot; width=&quot;3.2&quot; height=&quot;12&quot; rx=&quot;1&quot; fill=&quot;#fff&quot;/&gt;

    &lt;span class=&quot;badge&quot;&gt;按 &lt;kbd&gt;空格&lt;/kbd&gt; 切换&lt;/span&gt;
  &lt;/div&gt;

&lt;script&gt;
(function(){
  var scene = document.getElementById(&#39;scene&#39;);
  var btn   = document.getElementById(&#39;toggleBtn&#39;);
  var txt   = document.getElementById(&#39;btnText&#39;);
  var plays = document.querySelectorAll(&#39;.i-play&#39;);
  var pauses= document.querySelectorAll(&#39;.i-pause&#39;);

  var reduced = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches;
  var playing = !reduced;

  function apply(){
    document.body.classList.toggle(&#39;is-paused&#39;, !playing);
    btn.setAttribute(&#39;aria-pressed&#39;, String(playing));
    txt.textContent = playing ? &#39;暂停&#39; : &#39;播放&#39;;
    for (var i=0;i&lt;plays.length;i++)  plays[i].style.display  = playing ? &#39;none&#39; : &#39;&#39;;
    for (var j=0;j&lt;pauses.length;j++) pauses[j].style.display = playing ? &#39;&#39; : &#39;none&#39;;
  }

  function toggle(){ playing = !playing; apply(); }

  btn.addEventListener(&#39;click&#39;, toggle);

  window.addEventListener(&#39;keydown&#39;, function(e){
    if (e.key === &#39; &#39; || e.code === &#39;Space&#39;){
      if (e.target === btn) return; // let the button handle it natively
      e.preventDefault();
      toggle();
    }
  });

  apply();
})();
&lt;/script&gt;
