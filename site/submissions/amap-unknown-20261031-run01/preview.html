    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {

    .scene-wrap {
      position: relative;
      width: 100%;

      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, .45);

    svg.scene { display: block; width: 100%; height: 100%; }

    /* 动画 */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes cloud { from { transform: translateX(1300px); } to { transform: translateX(-400px); } }
    @keyframes ground { from { transform: translateX(0); } to { transform: translateX(-200px); } }
    @keyframes wing { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
    @keyframes pouch { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.06); } }

    .wheel { animation: spin 1.2s linear infinite; transform-origin: center; }
    .pedal-group { animation: pedal 1.2s linear infinite; transform-origin: center; }
    .pelican-body { animation: bob 1.2s ease-in-out infinite; }
    .cloud1 { animation: cloud 18s linear infinite; }
    .cloud2 { animation: cloud 24s linear infinite; animation-delay: -8s; }
    .cloud3 { animation: cloud 21s linear infinite; animation-delay: -14s; }
    .ground-marks { animation: ground 1.5s linear infinite; }
    .wing-anim { animation: wing 1.2s ease-in-out infinite; transform-origin: 540px 310px; }
    .pouch-anim { animation: pouch 1.2s ease-in-out infinite; transform-origin: center top; }

    .paused .wheel, .paused .pedal-group, .paused .pelican-body,
    .paused .cloud1, .paused .cloud2, .paused .cloud3,
    .paused .ground-marks, .paused .wing-anim, .paused .pouch-anim {
      animation-play-state: paused;
    }
    @media (prefers-reduced-motion: reduce) {
      .wheel, .pedal-group, .pelican-body,
      .cloud1, .cloud2, .cloud3,
      .ground-marks, .wing-anim, .pouch-anim { animation-play-state: paused; }
    }

          &lt;path d=&quot;M340 390 Q380 430 410 500 Q415 510 420 510&quot; fill=&quot;none&quot; stroke=&quot;#d8d0c0&quot; stroke-width=&quot;6&quot; stroke-linecap=&quot;round&quot;/&gt;
          &lt;ellipse cx=&quot;420&quot; cy=&quot;510&quot; rx=&quot;10&quot; ry=&quot;7&quot; fill=&quot;#e8a030&quot;/&gt;
        &lt;/g&gt;
      &lt;/g&gt;

      &lt;!-- 远处飞鸟与速度线 --&gt;
      &lt;g opacity=&quot;.4&quot;&gt;
        &lt;path d=&quot;M150 180 Q155 174 160 180 Q165 174 170 180&quot; fill=&quot;none&quot; stroke=&quot;#333&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;path d=&quot;M820 120 Q825 114 830 120 Q835 114 840 120&quot; fill=&quot;none&quot; stroke=&quot;#333&quot; stroke-width=&quot;1.5&quot;/&gt;
        &lt;path d=&quot;M780 150 Q784 145 788 150 Q792 145 796 150&quot; fill=&quot;none&quot; stroke=&quot;#333&quot; stroke-width=&quot;1.2&quot;/&gt;
      &lt;/g&gt;
      &lt;g opacity=&quot;.25&quot;&gt;
        &lt;line x1=&quot;100&quot; y1=&quot;500&quot; x2=&quot;250&quot; y2=&quot;500&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;12 8&quot;/&gt;
        &lt;line x1=&quot;50&quot; y1=&quot;540&quot; x2=&quot;200&quot; y2=&quot;540&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;10 10&quot;/&gt;
        &lt;line x1=&quot;120&quot; y1=&quot;570&quot; x2=&quot;300&quot; y2=&quot;570&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;8 12&quot;/&gt;

  &lt;div class=&quot;controls&quot;&gt;
    &lt;button class=&quot;btn&quot; id=&quot;toggleBtn&quot; aria-label=&quot;暂停动画&quot; type=&quot;button&quot;&gt;
      &lt;svg id=&quot;iconPause&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;6&quot; y=&quot;4&quot; width=&quot;4&quot; height=&quot;16&quot; rx=&quot;1&quot;/&gt;&lt;rect x=&quot;14&quot; y=&quot;4&quot; width=&quot;4&quot; height=&quot;16&quot; rx=&quot;1&quot;/&gt;&lt;/svg&gt;
      &lt;svg id=&quot;iconPlay&quot; viewBox=&quot;0 0 24 24&quot; style=&quot;display:none&quot; aria-hidden=&quot;true&quot;&gt;&lt;polygon points=&quot;6,4 20,12 6,20&quot;/&gt;&lt;/svg&gt;
      &lt;span id=&quot;btnLabel&quot;&gt;暂停&lt;/span&gt;
    &lt;/button&gt;
    &lt;span class=&quot;hint&quot;&gt;空格键切换&lt;/span&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (function () {
      const wrap = document.getElementById(&#39;sceneWrap&#39;);
      const btn = document.getElementById(&#39;toggleBtn&#39;);
      const label = document.getElementById(&#39;btnLabel&#39;);
      const iconPause = document.getElementById(&#39;iconPause&#39;);
      const iconPlay = document.getElementById(&#39;iconPlay&#39;);
      let playing = true;

      function pause() {
        playing = false;
        wrap.classList.add(&#39;paused&#39;);
        label.textContent = &#39;播放&#39;;
        btn.setAttribute(&#39;aria-label&#39;, &#39;播放动画&#39;);
        iconPause.style.display = &#39;none&#39;;
        iconPlay.style.display = &#39;block&#39;;
      }
      function play() {
        playing = true;
        wrap.classList.remove(&#39;paused&#39;);
        label.textContent = &#39;暂停&#39;;
        btn.setAttribute(&#39;aria-label&#39;, &#39;暂停动画&#39;);
        iconPause.style.display = &#39;block&#39;;
        iconPlay.style.display = &#39;none&#39;;
      }
      function toggle() { playing ? pause() : play(); }

      // 遵循系统“减少动态效果”设置
      if (window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches) pause();
      btn.addEventListener(&#39;click&#39;, toggle);
      document.addEventListener(&#39;keydown&#39;, function (e) {
        if (e.code === &#39;Space&#39; || e.key === &#39; &#39;) {
          e.preventDefault();
          toggle();
        }
      });
    })();
  &lt;/script&gt;
&lt;/body&gt;
