  &lt;style&gt;
    :root {

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 280px;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, sans-serif;

    main {
      width: min(1120px, 100%);

      margin-inline: auto;
      padding: 38px 40px 26px;
      display: flex;
      flex-direction: column;
      justify-content: center;

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .edition {
      margin: 0 0 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, &quot;Songti SC&quot;, &quot;SimSun&quot;, serif;
      font-size: clamp(30px, 4vw, 48px);
      font-weight: 500;
      letter-spacing: .06em;
    }

    .stamp {
      width: 66px;
      height: 66px;
      flex-shrink: 0;
      border: 1px solid #9ca99a;
      border-radius: 50%;
      display: grid;
      place-content: center;
      text-align: center;
      font-size: 10px;
      line-height: 1.7;
      letter-spacing: .12em;
      transform: rotate(9deg);
    }

    .stamp strong { font: italic 23px Georgia, serif; }

    .scene {
      position: relative;
      margin: 22px 0 25px;
      overflow: hidden;
      border-radius: 48% 48% 14px 14px / 12% 12% 14px 14px;
      background: #e5ede5;
    }

    svg { width: 100%; height: auto; display: block; }

    footer {
      padding-top: 21px;
      border-top: 1px solid #cbd0c2;
    }

    .caption { margin: 0; font-size: 14px; line-height: 1.8; }
    .caption span { display: block; color: var(--muted); font-size: 11px; letter-spacing: .1em; }
    .controls { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .shortcut { color: var(--muted); font-size: 11px; }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 46px;
      min-width: 116px;
      padding: 11px 18px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover { background: #39645a; }
    button:focus-visible { outline: 3px solid var(--orange); outline-offset: 5px; }
    .control-icon { width: 12px; height: 14px; position: relative; }
    .control-icon::before, .control-icon::after {
      content: &quot;&quot;;
      position: absolute;
      top: 1px;
      width: 3px;
      height: 12px;
      background: currentColor;
    }
    .control-icon::before { left: 1px; }
    .control-icon::after { right: 1px; }
    .paused .control-icon::before {
      width: 0;
      height: 0;
      left: 2px;
      top: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 10px solid currentColor;
      background: transparent;
    }
    .paused .control-icon::after { display: none; }

    .wheel { animation: revolve 1.6s linear infinite; }
    .rear-wheel { transform-origin: 350px 433px; }
    .front-wheel { transform-origin: 701px 433px; }
    .crank { transform-origin: 490px 426px; animation: revolve 1.6s linear infinite; }
    .rider { animation: bounce .8s ease-in-out infinite; }
    .scarf { transform-origin: 567px 223px; animation: flutter .8s ease-in-out infinite alternate; }
    .wing { transform-origin: 485px 271px; animation: wing 1.6s ease-in-out infinite; }
    .road-marks { animation: travel 1.6s linear infinite; }
    .clouds { animation: drift 22s linear infinite; }
    .grass-near { animation: travel 3.2s linear infinite; }
    .paused .motion { animation-play-state: paused; }

    @keyframes revolve { to { transform: rotate(360deg); } }
    @keyframes bounce { 50% { transform: translateY(-3px) rotate(.3deg); } }
    @keyframes flutter { to { transform: rotate(-7deg) scaleY(.86); } }
    @keyframes wing { 50% { transform: rotate(-3deg); } }
    @keyframes travel { to { transform: translateX(-240px); } }
    @keyframes drift { to { transform: translateX(-120px); } }

    @media (max-width: 600px) {
      main { padding: 26px 18px 22px; }
      .scene { margin-top: 28px; border-radius: 100px 100px 12px 12px / 35px 35px 12px 12px; }
      .scene svg { width: 150%; max-width: none; margin-left: -25%; }
      .stamp { width: 54px; height: 54px; font-size: 8px; }
      .stamp strong { font-size: 20px; }
      footer { align-items: flex-start; gap: 14px; }
      .caption { font-size: 12px; }
      .caption span { font-size: 9px; max-width: 180px; }
      .shortcut { display: none; }
      button { min-width: 102px; padding-inline: 13px; }
    }

        &lt;path fill=&quot;url(#grain)&quot; d=&quot;M0 0H1040V570H0z&quot; pointer-events=&quot;none&quot;/&gt;
        &lt;text x=&quot;38&quot; y=&quot;548&quot; fill=&quot;#7c8068&quot; font-family=&quot;Georgia, serif&quot; font-size=&quot;11&quot; letter-spacing=&quot;3&quot;&gt;A GOOD DAY TO GO SLOW&lt;/text&gt;
      &lt;/svg&gt;
    &lt;/div&gt;

    &lt;footer&gt;
      &lt;p class=&quot;caption&quot;&gt;不赶时间，只追海风。&lt;span&gt;沿海公路 · 今日的目的地：好心情&lt;/span&gt;&lt;/p&gt;
      &lt;div class=&quot;controls&quot;&gt;
        &lt;span class=&quot;shortcut&quot; aria-hidden=&quot;true&quot;&gt;空格键 · 播放 / 暂停&lt;/span&gt;
        &lt;button id=&quot;toggle&quot; type=&quot;button&quot; aria-label=&quot;播放动画&quot; aria-describedby=&quot;motion-help&quot;&gt;
          &lt;span class=&quot;control-icon&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
          &lt;span id=&quot;button-label&quot;&gt;播放动画&lt;/span&gt;
        &lt;/button&gt;
      &lt;/div&gt;
    &lt;/footer&gt;
    &lt;p id=&quot;motion-help&quot; hidden&gt;点击按钮或按空格键切换动画。偏好减少动态时，默认暂停。&lt;/p&gt;
  &lt;/main&gt;
  &lt;script&gt;
    (() =&gt; {
      &quot;use strict&quot;;

      const button = document.getElementById(&quot;toggle&quot;);
      const label = document.getElementById(&quot;button-label&quot;);
      const preference = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
      const parts = Object.fromEntries([
        &quot;near-leg&quot;, &quot;near-leg-highlight&quot;, &quot;far-leg&quot;, &quot;near-foot&quot;,
        &quot;far-foot&quot;, &quot;near-pedal&quot;, &quot;far-pedal&quot;
      ].map(id =&gt; [id, document.getElementById(id)]));

      let playing = false;
      let manuallyChosen = false;
      let elapsed = 0;
      let previous = null;
      let frame = null;

      function drawLeg(side, angle) {
        const near = side === &quot;near&quot;;
        const x = 490 + 31 * Math.cos(angle);
        const y = 426 + 31 * Math.sin(angle);
        const hipX = near ? 514 : 466;
        const hipY = near ? 316 : 307;
        const kneeX = (hipX + x) / 2 + (near ? 23 : -19);
        const kneeY = (hipY + y) / 2 - 1;
        const path = `M${hipX} ${hipY}L${kneeX} ${kneeY}L${x} ${y}`;
        parts[`${side}-leg`].setAttribute(&quot;d&quot;, path);
        if (near) parts[&quot;near-leg-highlight&quot;].setAttribute(&quot;d&quot;, path);
        parts[`${side}-foot`].setAttribute(&quot;d&quot;, `M${x - 8} ${y}h26`);
        parts[`${side}-pedal`].setAttribute(&quot;d&quot;, `M${x - 12} ${y + 8}h29`);
      }

      function render() {
        const angle = elapsed / 1600 * Math.PI * 2;
        drawLeg(&quot;near&quot;, angle);
        drawLeg(&quot;far&quot;, angle + Math.PI);
      }

      function tick(now) {
        if (!playing) return;
        if (previous !== null) elapsed += now - previous;
        previous = now;
        render();
        frame = requestAnimationFrame(tick);
      }

      function setPlaying(value) {
        playing = value;
        document.body.classList.toggle(&quot;paused&quot;, !playing);
        const text = playing ? &quot;暂停动画&quot; : &quot;播放动画&quot;;
        label.textContent = text;
        button.setAttribute(&quot;aria-label&quot;, text);
        previous = null;
        if (frame !== null) cancelAnimationFrame(frame);
        frame = playing ? requestAnimationFrame(tick) : null;
      }

      function toggle() {
        manuallyChosen = true;
        setPlaying(!playing);
      }

      button.addEventListener(&quot;click&quot;, toggle);
      document.addEventListener(&quot;keydown&quot;, event =&gt; {
        if (event.code !== &quot;Space&quot; || event.altKey || event.ctrlKey || event.metaKey) return;
        const target = event.target;
        if (target instanceof HTMLElement &amp;&amp;
            (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName))) return;
        event.preventDefault();
        if (!event.repeat) toggle();
      });

      preference.addEventListener(&quot;change&quot;, event =&gt; {
        if (!manuallyChosen) setPlaying(!event.matches);
      });

      document.addEventListener(&quot;visibilitychange&quot;, () =&gt; {
        previous = null;
      });

      render();
      setPlaying(!preference.matches);
    })();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe></body></html>
