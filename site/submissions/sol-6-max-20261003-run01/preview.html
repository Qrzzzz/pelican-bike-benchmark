    &lt;header class=&quot;intro&quot;&gt;
      &lt;p class=&quot;eyebrow&quot;&gt;A little sunny ride&lt;/p&gt;
      &lt;h1&gt;顺风，出发。&lt;/h1&gt;
      &lt;p class=&quot;subtitle&quot;&gt;和鹈鹕先生一起，把好天气骑成一首歌。&lt;/p&gt;
    &lt;/header&gt;

    &lt;div class=&quot;controls&quot;&gt;
      &lt;button id=&quot;motionToggle&quot; class=&quot;motion-button&quot; type=&quot;button&quot; aria-pressed=&quot;true&quot;&gt;
        &lt;svg class=&quot;pause-icon&quot; viewBox=&quot;0 0 20 20&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;3&quot; y=&quot;2&quot; width=&quot;5&quot; height=&quot;16&quot; rx=&quot;1&quot;/&gt;&lt;rect x=&quot;12&quot; y=&quot;2&quot; width=&quot;5&quot; height=&quot;16&quot; rx=&quot;1&quot;/&gt;&lt;/svg&gt;
        &lt;svg class=&quot;play-icon&quot; viewBox=&quot;0 0 20 20&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M5 2.7c0-.8.9-1.3 1.6-.9l11.2 7.1c.7.4.7 1.4 0 1.8L6.6 18c-.7.4-1.6-.1-1.6-.9V2.7Z&quot;/&gt;&lt;/svg&gt;
        &lt;span id=&quot;motionLabel&quot;&gt;暂停动画&lt;/span&gt;
      &lt;/button&gt;
      &lt;span class=&quot;hint&quot;&gt;空格键也可播放或暂停&lt;/span&gt;
    &lt;/div&gt;
    &lt;span class=&quot;folio&quot; aria-hidden=&quot;true&quot;&gt;01 / Keep rolling&lt;/span&gt;
  &lt;/main&gt;

  &lt;script&gt;
    (() =&gt; {
      &#39;use strict&#39;;

      const byId = (id) =&gt; document.getElementById(id);
      const art = byId(&#39;art&#39;);
      const button = byId(&#39;motionToggle&#39;);
      const label = byId(&#39;motionLabel&#39;);
      const reducedMotion = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
      const rearSpokes = byId(&#39;rearSpokes&#39;);
      const frontSpokes = byId(&#39;frontSpokes&#39;);
      const crankArms = byId(&#39;crankArms&#39;);
      const frontPedal = byId(&#39;frontPedal&#39;);
      const backPedal = byId(&#39;backPedal&#39;);
      const frontLeg = byId(&#39;frontLeg&#39;);
      const backLeg = byId(&#39;backLeg&#39;);
      const frontFoot = byId(&#39;frontFoot&#39;);
      const backFoot = byId(&#39;backFoot&#39;);
      const pelican = byId(&#39;pelican&#39;);
      const wing = byId(&#39;wing&#39;);
      const roadMarkings = byId(&#39;roadMarkings&#39;);
      const clouds = [byId(&#39;cloudOne&#39;), byId(&#39;cloudTwo&#39;), byId(&#39;cloudThree&#39;)];

      let playing = !reducedMotion.matches;
      let userChangedPlayback = false;
      let elapsed = 0;
      let previousTime = 0;
      let frameId = 0;

      function fitScene() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const mobile = width &lt;= 700;
        const worldWidth = mobile ? 790 : 1200;
        const worldHeight = worldWidth * height / width;
        const left = mobile ? 240 : 0;
        const top = mobile ? 575 - worldHeight * .6 : 400 - worldHeight * .5;
        art.setAttribute(&#39;viewBox&#39;, `${left} ${top} ${worldWidth} ${worldHeight}`);
      }

      function drawLeg(path, foot, hipX, hipY, pedalX, pedalY, front, bob, phase) {
        const kneeX = hipX + (pedalX - hipX) * (front ? .48 : .38) + (front ? 15 : -20) + Math.sin(phase) * 8;
        const kneeY = (front ? 463 : 473) + Math.cos(phase) * 11 + bob * .5;
        path.setAttribute(&#39;d&#39;, `M${hipX} ${hipY + bob} L${kneeX.toFixed(1)} ${kneeY.toFixed(1)} L${pedalX.toFixed(1)} ${pedalY.toFixed(1)}`);
        foot.setAttribute(&#39;d&#39;, `M${(pedalX - 10).toFixed(1)} ${(pedalY + 2).toFixed(1)} Q${(pedalX + 6).toFixed(1)} ${(pedalY + 10).toFixed(1)} ${(pedalX + 24).toFixed(1)} ${(pedalY + 3).toFixed(1)}`);
      }

      function render(time) {
        const wheelDegrees = (time * 176) % 360;
        const crank = time * 3.8 - .65;
        const crankDegrees = crank * 180 / Math.PI;
        const pedalRadius = 56;
        const frontX = 630 + Math.cos(crank) * pedalRadius;
        const frontY = 575 + Math.sin(crank) * pedalRadius;
        const backX = 630 - Math.cos(crank) * pedalRadius;
        const backY = 575 - Math.sin(crank) * pedalRadius;
        const bob = Math.sin(time * 7.6) * 3;

        rearSpokes.setAttribute(&#39;transform&#39;, `rotate(${wheelDegrees})`);
        frontSpokes.setAttribute(&#39;transform&#39;, `rotate(${wheelDegrees})`);
        crankArms.setAttribute(&#39;transform&#39;, `rotate(${crankDegrees} 630 575)`);
        frontPedal.setAttribute(&#39;transform&#39;, `translate(${frontX.toFixed(1)} ${frontY.toFixed(1)})`);
        backPedal.setAttribute(&#39;transform&#39;, `translate(${backX.toFixed(1)} ${backY.toFixed(1)})`);
        drawLeg(frontLeg, frontFoot, 586, 386, frontX, frontY, true, bob, crank);
        drawLeg(backLeg, backFoot, 548, 387, backX, backY, false, bob, crank + Math.PI);
        pelican.setAttribute(&#39;transform&#39;, `translate(0 ${bob.toFixed(1)})`);
        wing.setAttribute(&#39;transform&#39;, `rotate(${(Math.sin(time * 3.8) * 1.3).toFixed(2)} 565 316)`);
        roadMarkings.setAttribute(&#39;patternTransform&#39;, `translate(${(-time * 210) % 185} 0)`);
        clouds[0].setAttribute(&#39;transform&#39;, `translate(${(Math.sin(time * .38) * 18).toFixed(1)} 0)`);
        clouds[1].setAttribute(&#39;transform&#39;, `translate(${(Math.sin(time * .29 + 1) * 12).toFixed(1)} 0)`);
        clouds[2].setAttribute(&#39;transform&#39;, `translate(${(Math.sin(time * .32 + 2) * 15).toFixed(1)} 0)`);
      }

      function tick(now) {
        if (!playing || document.hidden) return;
        if (previousTime) elapsed += Math.min((now - previousTime) / 1000, .05);
        previousTime = now;
        render(elapsed);
        frameId = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        button.setAttribute(&#39;aria-pressed&#39;, String(playing));
        label.textContent = playing ? &#39;暂停动画&#39; : &#39;播放动画&#39;;
        if (frameId) cancelAnimationFrame(frameId);
        frameId = 0;
        previousTime = 0;
        if (playing &amp;&amp; !document.hidden) frameId = requestAnimationFrame(tick);
      }

      function togglePlayback() {
        userChangedPlayback = true;
        playing = !playing;
        syncPlayback();
      }

      button.addEventListener(&#39;click&#39;, togglePlayback);
      document.addEventListener(&#39;keydown&#39;, (event) =&gt; {
        if (event.code !== &#39;Space&#39; &amp;&amp; event.key !== &#39; &#39;) return;
        event.preventDefault();
        if (!event.repeat) togglePlayback();
      });
      document.addEventListener(&#39;visibilitychange&#39;, syncPlayback);
      window.addEventListener(&#39;resize&#39;, fitScene, { passive: true });
      reducedMotion.addEventListener(&#39;change&#39;, () =&gt; {
        if (!userChangedPlayback) {
          playing = !reducedMotion.matches;
          syncPlayback();
        }
      });

      fitScene();
      render(0);
      syncPlayback();
    })();
  &lt;/script&gt;
