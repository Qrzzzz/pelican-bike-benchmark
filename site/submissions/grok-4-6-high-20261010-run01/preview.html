    :root {

    .stage {

    .scene {

      vertical-align: middle;
      background: #8ec8de;

    .hud {

      right: 0;

    @keyframes thighF {

  &lt;script&gt;
    (function () {
      var stage = document.getElementById(&#39;stage&#39;);
      var btn = document.getElementById(&#39;toggle&#39;);
      var label = document.getElementById(&#39;toggle-label&#39;);
      var reduceMq = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
      var playing = !reduceMq.matches;

      function sync() {
        stage.classList.toggle(&#39;is-paused&#39;, !playing);
        stage.classList.toggle(&#39;is-playing&#39;, playing);
        document.documentElement.classList.toggle(&#39;reduce-motion&#39;, reduceMq.matches);
        btn.setAttribute(&#39;aria-pressed&#39;, playing ? &#39;true&#39; : &#39;false&#39;);
        btn.setAttribute(&#39;aria-label&#39;, playing ? &#39;暂停动画&#39; : &#39;播放动画&#39;);
        label.textContent = playing ? &#39;暂停&#39; : &#39;播放&#39;;
      }

      function toggle() {
        playing = !playing;
        sync();
      }

      btn.addEventListener(&#39;click&#39;, toggle);

      window.addEventListener(&#39;keydown&#39;, function (e) {
        if (e.code === &#39;Space&#39; || e.key === &#39; &#39; || e.key === &#39;Spacebar&#39;) {
          e.preventDefault();
          toggle();
        }
      });

      function onReduceChange() {
        playing = !reduceMq.matches;
        sync();
      }

      if (reduceMq.addEventListener) reduceMq.addEventListener(&#39;change&#39;, onReduceChange);
      else if (reduceMq.addListener) reduceMq.addListener(onReduceChange);

      sync();
    })();
  &lt;/script&gt;
