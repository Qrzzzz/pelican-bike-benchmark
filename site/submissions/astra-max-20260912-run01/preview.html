    &lt;footer class=&quot;controls&quot;&gt;
      &lt;div class=&quot;playback&quot;&gt;
        &lt;button id=&quot;toggle&quot; class=&quot;toggle&quot; type=&quot;button&quot; aria-controls=&quot;coastal-scene&quot; aria-label=&quot;播放动画&quot; aria-keyshortcuts=&quot;Space&quot;&gt;
          &lt;svg class=&quot;play-icon&quot; viewBox=&quot;0 0 16 16&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M4 2.5a.8.8 0 0 1 1.2-.7l8 5.5a.8.8 0 0 1 0 1.4l-8 5.5a.8.8 0 0 1-1.2-.7Z&quot;/&gt;&lt;/svg&gt;
          &lt;svg class=&quot;pause-icon&quot; viewBox=&quot;0 0 16 16&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;3&quot; y=&quot;2&quot; width=&quot;3.5&quot; height=&quot;12&quot; rx=&quot;1&quot;/&gt;&lt;rect x=&quot;9.5&quot; y=&quot;2&quot; width=&quot;3.5&quot; height=&quot;12&quot; rx=&quot;1&quot;/&gt;&lt;/svg&gt;
          &lt;span id=&quot;button-label&quot;&gt;播放动画&lt;/span&gt;
        &lt;/button&gt;
        &lt;span class=&quot;key-hint&quot;&gt;&lt;kbd&gt;空格&lt;/kbd&gt;也可以播放 / 暂停&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;endnote&quot;&gt;&lt;span class=&quot;status-dot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;span id=&quot;motion-note&quot;&gt;靠岸歇一会儿&lt;/span&gt;&lt;/div&gt;
    &lt;/footer&gt;
    &lt;p id=&quot;announcement&quot; class=&quot;sr-only&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;noscript&gt;&lt;p&gt;启用 JavaScript 即可播放动画。你仍然可以欣赏这幅静态海岸插画。&lt;/p&gt;&lt;/noscript&gt;
  &lt;/main&gt;

  &lt;script&gt;
    (() =&gt; {
      &#39;use strict&#39;;
      const byId = id =&gt; document.getElementById(id);
      const button = byId(&#39;toggle&#39;);
      const label = byId(&#39;button-label&#39;);
      const note = byId(&#39;motion-note&#39;);
      const announcement = byId(&#39;announcement&#39;);
      const preference = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;);
      const mobile = window.matchMedia(&#39;(max-width: 600px)&#39;);
      const scene = byId(&#39;coastal-scene&#39;);
      const parts = Object.fromEntries([
        &#39;rear-spokes&#39;, &#39;front-spokes&#39;, &#39;crank&#39;, &#39;near-pedal&#39;, &#39;far-pedal&#39;,
        &#39;near-leg&#39;, &#39;near-leg-outline&#39;, &#39;far-leg&#39;, &#39;far-leg-outline&#39;,
        &#39;pelican&#39;, &#39;scarf-tail&#39;, &#39;road-marks&#39;, &#39;roadside-plants&#39;, &#39;water-lines&#39;,
        &#39;clouds&#39;, &#39;gulls&#39;, &#39;sailboat&#39;, &#39;breeze&#39;, &#39;bike-shadow&#39;
      ].map(id =&gt; [id, byId(id)]));
      let playing = false;
      let manualChoice = false;
      let frame = null;
      let lastTime = null;
      let elapsed = 0;
      const TAU = Math.PI * 2;
      const transform = (id, value) =&gt; parts[id].setAttribute(&#39;transform&#39;, value);

      // Equal-length leg segments keep both webbed feet on the moving pedals.
      function legPath(hipX, hipY, footX, footY, length) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        const distance = Math.hypot(dx, dy);
        const bend = Math.sqrt(Math.max(0, length * length - distance * distance / 4));
        const kneeX = (hipX + footX) / 2 + dy / distance * bend;
        const kneeY = (hipY + footY) / 2 - dx / distance * bend;
        return `M${hipX.toFixed(2)} ${hipY.toFixed(2)}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${footX.toFixed(2)} ${footY.toFixed(2)}`;
      }

      function draw(time) {
        const angle = time * TAU / 2.2 - .6;
        const bob = Math.sin(time * TAU / 1.1) * 1.6;
        const pedalX = Math.cos(angle) * 32;
        const pedalY = Math.sin(angle) * 32;
        transform(&#39;rear-spokes&#39;, `rotate(${time * 140})`);
        transform(&#39;front-spokes&#39;, `rotate(${time * 140})`);
        transform(&#39;crank&#39;, `rotate(${angle * 180 / Math.PI})`);
        transform(&#39;near-pedal&#39;, `translate(${547 + pedalX} ${416 + pedalY})`);
        transform(&#39;far-pedal&#39;, `translate(${547 - pedalX} ${416 - pedalY})`);
        const nearLeg = legPath(519, 289 + bob, 547 + pedalX, 410 + pedalY, 86);
        const farLeg = legPath(505, 292 + bob, 547 - pedalX, 410 - pedalY, 86);
        parts[&#39;near-leg&#39;].setAttribute(&#39;d&#39;, nearLeg);
        parts[&#39;near-leg-outline&#39;].setAttribute(&#39;d&#39;, nearLeg);
        parts[&#39;far-leg&#39;].setAttribute(&#39;d&#39;, farLeg);
        parts[&#39;far-leg-outline&#39;].setAttribute(&#39;d&#39;, farLeg);
        transform(&#39;pelican&#39;, `translate(0 ${bob})`);
        transform(&#39;scarf-tail&#39;, `rotate(${Math.sin(time * 4) * 3.3} 550 191)`);
        transform(&#39;road-marks&#39;, `translate(${-((time * 215) % 280)} 0)`);
        transform(&#39;roadside-plants&#39;, `translate(${-((time * 160) % 1120)} 0)`);
        transform(&#39;water-lines&#39;, `translate(${-((time * 20) % 400)} 0)`);
        transform(&#39;clouds&#39;, `translate(${Math.sin(time / 15) * 24} 0)`);
        transform(&#39;gulls&#39;, `translate(${Math.sin(time / 8) * 12} ${Math.sin(time / 2) * 3})`);
        transform(&#39;sailboat&#39;, `translate(${Math.sin(time / 12) * 9} ${Math.sin(time * 1.2) * 1.4})`);
        transform(&#39;breeze&#39;, `translate(${Math.sin(time * 2) * 8} 0)`);
        parts[&#39;bike-shadow&#39;].setAttribute(&#39;rx&#39;, String(219 + bob * 1.2));
      }

      function tick(timestamp) {
        if (!playing || document.hidden) { frame = null; return; }
        if (lastTime !== null) elapsed += Math.min(timestamp - lastTime, 64) / 1000;
        lastTime = timestamp;
        draw(elapsed);
        frame = requestAnimationFrame(tick);
      }

      function syncClock() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        lastTime = null;
        if (playing &amp;&amp; !document.hidden) frame = requestAnimationFrame(tick);
      }

      function setPlaying(value, announce = false) {
        playing = value;
        document.body.dataset.playing = String(playing);
        const action = playing ? &#39;暂停动画&#39; : &#39;播放动画&#39;;
        label.textContent = action;
        button.setAttribute(&#39;aria-label&#39;, action);
        note.textContent = playing ? &#39;海风正好，慢慢向前&#39; : preference.matches &amp;&amp; !manualChoice ? &#39;已尊重减少动态偏好&#39; : &#39;靠岸歇一会儿&#39;;
        if (announce) announcement.textContent = playing ? &#39;动画已播放。&#39; : &#39;动画已暂停。&#39;;
        syncClock();
      }

      function toggle() { manualChoice = true; setPlaying(!playing, true); }
      button.addEventListener(&#39;click&#39;, toggle);
      document.addEventListener(&#39;keydown&#39;, event =&gt; {
        if ((event.code !== &#39;Space&#39; &amp;&amp; event.key !== &#39; &#39;) || event.altKey || event.ctrlKey || event.metaKey || event.isComposing) return;
        const target = event.target instanceof Element ? event.target : null;
        if (target &amp;&amp; (target.isContentEditable || target.closest(&#39;input, textarea, select, a, [role=&quot;textbox&quot;]&#39;))) return;
        if (target &amp;&amp; target.closest(&#39;button&#39;) &amp;&amp; target.closest(&#39;button&#39;) !== button) return;
        event.preventDefault();
        if (!event.repeat) toggle();
      });
      document.addEventListener(&#39;visibilitychange&#39;, syncClock);
      preference.addEventListener(&#39;change&#39;, () =&gt; {
        if (!manualChoice) setPlaying(!preference.matches);
      });

      // On phones, frame the complete rider more closely while preserving scale.
      function fitScene() {
        scene.setAttribute(&#39;viewBox&#39;, mobile.matches ? &#39;305 0 560 550&#39; : &#39;0 0 1120 550&#39;);
        scene.setAttribute(&#39;preserveAspectRatio&#39;, mobile.matches ? &#39;xMidYMid meet&#39; : &#39;xMidYMid slice&#39;);
      }
      mobile.addEventListener(&#39;change&#39;, fitScene);
      fitScene();
      draw(0);
      setPlaying(!preference.matches);
    })();
  &lt;/script&gt;
