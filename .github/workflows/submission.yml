name: Submission contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: submission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  submission-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate submission contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: npm run check:pr
      - name: Validate site and derived evidence
        run: npm run check
      - name: Upload submission report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: submission-report
          path: output/submission-report.json
          retention-days: 14
          if-no-files-found: warn
